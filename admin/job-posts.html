<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Job Post Approvals — JSM</title>
    <link rel="icon" type="image/svg+xml" href="../assets/brand/jsm-favicon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="../assets/brand/jsm-icon-192.png">
    <link rel="apple-touch-icon" href="../assets/brand/jsm-icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://enuvex.onrender.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../job-seeker/enuvex-app.css">
    <link rel="stylesheet" href="../assets/css/enuvex-role.css">
    <script>
        window.ENUVEX_PAGE = {
            active: 'job-posts',
            title: 'Job Post Approvals',
            subtitle: 'Review postings before they reach job seekers'
        };
    </script>
</head>
<body data-role="admin">
<div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="side-overlay" id="sideOverlay"></div>

    <div class="main">
        <header class="topbar" id="topbar"></header>

        <main class="content">
            <div class="page-head">
                <div>
                    <h2>Job postings</h2>
                    <p>Only an approved posting is visible to job seekers. Rejection and correction requests require a reason that is sent to the employer.</p>
                </div>
                <div class="page-head-actions">
                    <span class="badge-neutral" id="totalBadge">0 posts</span>
                </div>
            </div>

            <div class="alert" id="pageError" hidden>
                <i class="fas fa-circle-exclamation"></i>
                <span id="pageErrorText">Could not load job posts.</span>
            </div>

            <div class="card rv-toolbar">
                <label class="field" for="jobSearch">
                    <i class="fas fa-magnifying-glass"></i>
                    <input type="search" id="jobSearch" placeholder="Search title, employer or barangay">
                </label>
                <div class="form-field">
                    <label for="statusFilter">Moderation status</label>
                    <select id="statusFilter">
                        <option value="PENDING_REVIEW">Awaiting approval</option>
                        <option value="APPROVED">Approved</option>
                        <option value="CHANGES_REQUESTED">Changes requested</option>
                        <option value="REJECTED">Rejected</option>
                        <option value="ALL">All statuses</option>
                    </select>
                </div>
                <div class="form-field">
                    <label for="municipalityFilter">Municipality</label>
                    <select id="municipalityFilter">
                        <option value="ALL">All municipalities</option>
                    </select>
                </div>
                <div class="form-field">
                    <label for="typeFilter">Employment type</label>
                    <select id="typeFilter">
                        <option value="ALL">All types</option>
                        <option value="FULL_TIME">Full time</option>
                        <option value="PART_TIME">Part time</option>
                        <option value="CONTRACT">Contract</option>
                        <option value="TEMPORARY">Temporary</option>
                    </select>
                </div>
                <span class="rv-spacer"></span>
                <span class="muted" id="resultCount"></span>
            </div>

            <div id="jobTable">
                <div class="loading">Loading job posts…</div>
            </div>

            <div class="pagination" id="pager" hidden></div>
        </main>
    </div>
</div>

<div class="modal" id="jobModal" hidden>
    <div class="modal-card modal-wide" role="dialog" aria-modal="true" aria-labelledby="jobModalTitle">
        <div class="modal-head">
            <h3 id="jobModalTitle">Job posting</h3>
            <button class="modal-close" type="button" id="closeJobModal" aria-label="Close"><i class="fas fa-xmark"></i></button>
        </div>
        <div class="modal-body" id="jobModalBody"></div>
        <div class="modal-foot">
            <button class="btn-soft" type="button" id="dismissJobModal">Close</button>
        </div>
    </div>
</div>

<nav class="bottom-nav" id="bottomNav" aria-label="Quick navigation"></nav>
<div class="toast-container" id="toastContainer" aria-live="polite"></div>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/role-app.js"></script>
<script>
(function () {
    'use strict';

    var PAGE_SIZE = 12;
    var state = { jobs: [], query: '', status: 'PENDING_REVIEW', municipality: 'ALL', type: 'ALL', page: 0 };

    function showError(message) {
        var box = document.getElementById('pageError');
        var text = document.getElementById('pageErrorText');
        if (!box || !text) return;
        text.textContent = message;
        box.hidden = false;
    }

    function statusOf(job) {
        return job.moderationStatus || 'PENDING_REVIEW';
    }

    function statusBadge(status) {
        var map = {
            APPROVED: ['badge-ok', 'Approved'],
            PENDING_REVIEW: ['badge-wait', 'Pending review'],
            CHANGES_REQUESTED: ['badge-neutral', 'Changes requested'],
            REJECTED: ['badge-off', 'Rejected']
        };
        var entry = map[status] || ['badge-neutral', status];
        return '<span class="' + entry[0] + '">' + entry[1] + '</span>';
    }

    function filtered() {
        return state.jobs.filter(function (job) {
            if (state.status !== 'ALL' && statusOf(job) !== state.status) return false;
            if (state.municipality !== 'ALL' && String(job.municipality) !== state.municipality) return false;
            if (state.type !== 'ALL' && String(job.employmentType) !== state.type) return false;
            if (!state.query) return true;
            var haystack = [job.jobTitle, job.employerName, job.barangay, job.category, ROLE.municipalityLabel(job.municipality)]
                .filter(Boolean).join(' ').toLowerCase();
            return haystack.indexOf(state.query) !== -1;
        }).sort(function (a, b) {
            return new Date(b.createdAt || 0) - new Date(a.createdAt || 0);
        });
    }

    function actionsFor(job) {
        var id = ROLE.esc(String(job.id));
        var status = statusOf(job);
        if (status === 'PENDING_REVIEW') {
            return '<button class="btn-solid btn-sm" type="button" data-approve="' + id + '">Approve</button>'
                + '<button class="btn-soft btn-sm" type="button" data-changes="' + id + '">Request changes</button>'
                + '<button class="btn-danger btn-sm" type="button" data-reject="' + id + '">Reject</button>';
        }
        if (status === 'CHANGES_REQUESTED') {
            return '<button class="btn-solid btn-sm" type="button" data-approve="' + id + '">Approve</button>'
                + '<button class="btn-danger btn-sm" type="button" data-reject="' + id + '">Reject</button>';
        }
        if (status === 'REJECTED') {
            return '<button class="btn-soft btn-sm" type="button" data-restore="' + id + '">Send back to queue</button>';
        }
        return '<button class="btn-soft btn-sm" type="button" data-changes="' + id + '">Request changes</button>'
            + '<button class="btn-danger btn-sm" type="button" data-reject="' + id + '">Reject</button>';
    }

    function render() {
        var list = filtered();
        var pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
        if (state.page >= pages) state.page = pages - 1;
        var slice = list.slice(state.page * PAGE_SIZE, (state.page + 1) * PAGE_SIZE);

        document.getElementById('totalBadge').textContent = state.jobs.length + ' posts';
        document.getElementById('resultCount').textContent = list.length + ' matching post' + (list.length === 1 ? '' : 's');

        var container = document.getElementById('jobTable');
        if (!state.jobs.length) {
            container.innerHTML = '<div class="card panel"><div class="empty">'
                + '<i class="fas fa-briefcase"></i>'
                + '<strong>No job posts on the platform yet</strong>'
                + '<p>Listings created by employers will appear here for review.</p>'
                + '</div></div>';
            document.getElementById('pager').hidden = true;
            return;
        }
        if (!slice.length) {
            container.innerHTML = '<div class="card panel"><div class="empty">'
                + '<i class="fas fa-filter"></i>'
                + '<strong>No posts match this filter</strong>'
                + '<p>Try another moderation status, municipality or search term.</p>'
                + '</div></div>';
            document.getElementById('pager').hidden = true;
            return;
        }

        container.innerHTML = '<div class="table-wrap"><table class="data-table"><thead><tr>'
            + '<th class="num">#</th><th>Position</th><th>Employer</th><th>Category</th>'
            + '<th>Location</th><th>Salary</th><th>Applicants</th><th>Moderation</th><th>Posted</th><th>Actions</th>'
            + '</tr></thead><tbody>'
            + slice.map(function (job, index) {
                var salaryText = (job.salaryMin != null || job.salaryMax != null) ? ROLE.salaryLabel(job) : 'Not stated';
                var employerVerified = String(job.employerVerificationStatus) === 'VERIFIED';
                return '<tr>'
                    + '<td class="num">' + (state.page * PAGE_SIZE + index + 1) + '</td>'
                    + '<td><span class="cell-main">' + ROLE.esc(job.jobTitle || 'Untitled') + '</span>'
                    + '<span class="cell-sub">' + ROLE.esc(ROLE.typeLabel(job.employmentType) || 'Type not set') + '</span></td>'
                    + '<td><span class="cell-main">' + ROLE.esc(job.employerName || 'Unknown employer') + '</span>'
                    + '<span class="cell-sub">' + (employerVerified ? 'Verified employer' : 'Not verified') + '</span></td>'
                    + '<td>' + ROLE.esc(ROLE.categoryLabel(job.category)) + '</td>'
                    + '<td>' + ROLE.esc(ROLE.municipalityLabel(job.municipality) || '—')
                    + (job.barangay ? '<span class="cell-sub">' + ROLE.esc(job.barangay) + '</span>' : '') + '</td>'
                    + '<td>' + ROLE.esc(salaryText) + '</td>'
                    + '<td>' + ROLE.esc(String(job.applicantCount == null ? 0 : job.applicantCount)) + '</td>'
                    + '<td>' + statusBadge(statusOf(job))
                    + (job.active ? '' : '<span class="cell-sub">Saved as paused</span>') + '</td>'
                    + '<td>' + ROLE.esc(ROLE.dateLabel(job.createdAt)) + '</td>'
                    + '<td><div class="row-actions">'
                    + '<button class="btn-ghost btn-sm" type="button" data-details="' + ROLE.esc(String(job.id)) + '">Details</button>'
                    + '</div><div class="row-actions">' + actionsFor(job) + '</div></td>'
                    + '</tr>';
            }).join('')
            + '</tbody></table></div>';

        var pager = document.getElementById('pager');
        if (pages <= 1) {
            pager.hidden = true;
        } else {
            pager.hidden = false;
            pager.innerHTML = '<button class="btn-soft btn-sm" type="button" data-page="prev" ' + (state.page === 0 ? 'disabled' : '') + '>'
                + '<i class="fas fa-chevron-left"></i> Previous</button>'
                + '<span class="muted">Page ' + (state.page + 1) + ' of ' + pages + '</span>'
                + '<button class="btn-soft btn-sm" type="button" data-page="next" ' + (state.page >= pages - 1 ? 'disabled' : '') + '>'
                + 'Next <i class="fas fa-chevron-right"></i></button>';
        }
    }

    function fillMunicipalities() {
        var select = document.getElementById('municipalityFilter');
        var seen = {};
        state.jobs.forEach(function (job) {
            if (!job.municipality || seen[job.municipality]) return;
            seen[job.municipality] = true;
            var option = document.createElement('option');
            option.value = job.municipality;
            option.textContent = ROLE.municipalityLabel(job.municipality);
            select.appendChild(option);
        });
    }

    async function load() {
        var result = await ROLE.safe(ApiClient.getAdminJobPosts());
        if (ROLE.failed(result)) {
            showError(result.__error);
            document.getElementById('jobTable').innerHTML = '<div class="card panel"><div class="empty">'
                + '<i class="fas fa-triangle-exclamation"></i>'
                + '<strong>Job posts unavailable</strong>'
                + '<p>The job post list could not be loaded.</p>'
                + '</div></div>';
            return;
        }
        var page = (result && Array.isArray(result.content)) ? result.content : (Array.isArray(result) ? result : []);
        state.jobs = page;
        fillMunicipalities();
        render();
    }

    function openDetails(id) {
        var job = state.jobs.filter(function (item) { return String(item.id) === String(id); })[0];
        if (!job) return;
        document.getElementById('jobModalTitle').textContent = job.jobTitle || 'Job posting';
        var employerVerified = String(job.employerVerificationStatus) === 'VERIFIED';
        document.getElementById('jobModalBody').innerHTML = '<div class="kv-grid">'
            + '<div class="kv"><span>Employer</span><strong>' + ROLE.esc(job.employerName || '—') + '</strong></div>'
            + '<div class="kv"><span>Employer verification</span><strong>' + (employerVerified ? 'Verified' : 'Not verified') + '</strong></div>'
            + '<div class="kv"><span>Moderation</span><strong>' + ROLE.esc(String(statusOf(job)).replace(/_/g, ' ')) + '</strong></div>'
            + '<div class="kv"><span>Category</span><strong>' + ROLE.esc(ROLE.categoryLabel(job.category)) + '</strong></div>'
            + '<div class="kv"><span>Employment type</span><strong>' + ROLE.esc(ROLE.typeLabel(job.employmentType) || '—') + '</strong></div>'
            + '<div class="kv"><span>Location</span><strong>' + ROLE.esc(ROLE.municipalityLabel(job.municipality) || '—')
            + (job.barangay ? ', ' + ROLE.esc(job.barangay) : '') + '</strong></div>'
            + '<div class="kv"><span>Salary</span><strong>' + ROLE.esc((job.salaryMin != null || job.salaryMax != null) ? ROLE.salaryLabel(job) : 'Not stated') + '</strong></div>'
            + '<div class="kv"><span>Positions</span><strong>' + ROLE.esc(String(job.availablePositions == null ? '—' : job.availablePositions)) + '</strong></div>'
            + '<div class="kv"><span>Posted</span><strong>' + ROLE.esc(ROLE.dateLabel(job.createdAt)) + '</strong></div>'
            + '<div class="kv"><span>Applicants</span><strong>' + ROLE.esc(String(job.applicantCount == null ? 0 : job.applicantCount)) + '</strong></div>'
            + '</div>'
            + '<p class="block-title" style="margin-top: 16px;">Description</p>'
            + '<p>' + ROLE.esc(job.jobDescription || 'No description provided.') + '</p>'
            + '<p class="block-title" style="margin-top: 16px;">Responsibilities</p>'
            + '<p>' + ROLE.esc(job.responsibilities || 'No responsibilities provided.') + '</p>'
            + '<p class="block-title" style="margin-top: 16px;">Required skills</p>'
            + '<p>' + ROLE.esc(job.requiredSkills || 'Not specified.') + '</p>'
            + '<p class="block-title" style="margin-top: 16px;">Moderation history</p>'
            + '<div id="jobHistory"><div class="loading">Loading history…</div></div>';
        document.getElementById('jobModal').hidden = false;
        loadHistory(job.id);
    }

    async function loadHistory(jobId) {
        var result = await ROLE.safe(ApiClient.getAuditLogs({ targetType: 'JOB_POST', targetId: jobId }));
        var box = document.getElementById('jobHistory');
        if (!box) return;
        if (ROLE.failed(result) || !Array.isArray(result) || !result.length) {
            box.innerHTML = '<p class="muted">No moderation action recorded for this posting.</p>';
            return;
        }
        box.innerHTML = '<div class="stack">' + result.map(function (entry) {
            return '<div class="list-row"><div class="list-body">'
                + '<h4>' + ROLE.esc(String(entry.actionType || 'Action').replace(/_/g, ' ')) + '</h4>'
                + '<div class="list-meta">'
                + '<span><i class="fas fa-user-shield"></i>' + ROLE.esc(entry.adminUserEmail || 'Unknown administrator') + '</span>'
                + '<span><i class="fas fa-calendar"></i>' + ROLE.esc(ROLE.dateLabel(entry.createdAt)) + '</span>'
                + '</div>'
                + (entry.previousState || entry.newState
                    ? '<p class="muted">' + ROLE.esc(String(entry.previousState || '—')) + ' → ' + ROLE.esc(String(entry.newState || '—')) + '</p>'
                    : '')
                + (entry.reason ? '<p class="muted">' + ROLE.esc(entry.reason) + '</p>' : '')
                + '</div></div>';
        }).join('') + '</div>';
    }

    async function approve(id, button) {
        if (!confirm('Approve this posting? It becomes visible to job seekers immediately.')) return;
        if (button) button.disabled = true;
        try {
            await ApiClient.approveAdminJobPost(id);
            ROLE.toast('Posting approved and published.', 'success');
            await load();
        } catch (error) {
            ROLE.toast(error.message || 'Could not approve this posting.', 'error');
            if (button) button.disabled = false;
        }
    }

    async function reject(id, button) {
        var reason = prompt('Reason for rejecting this posting (required, sent to the employer):');
        if (reason === null || reason.trim() === '') return;
        if (button) button.disabled = true;
        try {
            await ApiClient.rejectAdminJobPost(id, reason);
            ROLE.toast('Posting rejected.', 'success');
            await load();
        } catch (error) {
            ROLE.toast(error.message || 'Could not reject this posting.', 'error');
            if (button) button.disabled = false;
        }
    }

    async function requestChanges(id, button) {
        var reason = prompt('What does the employer need to correct? (required, sent to the employer):');
        if (reason === null || reason.trim() === '') return;
        if (button) button.disabled = true;
        try {
            await ApiClient.changesRequestedAdminJobPost(id, reason);
            ROLE.toast('Corrections requested.', 'success');
            await load();
        } catch (error) {
            ROLE.toast(error.message || 'Could not request changes.', 'error');
            if (button) button.disabled = false;
        }
    }

    async function restore(id, button) {
        if (!confirm('Send this posting back into the approval queue?')) return;
        if (button) button.disabled = true;
        try {
            await ApiClient.restoreAdminJobPost(id);
            ROLE.toast('Posting returned to the queue.', 'success');
            await load();
        } catch (error) {
            ROLE.toast(error.message || 'Could not restore this posting.', 'error');
            if (button) button.disabled = false;
        }
    }

    /** Dashboard cards link here with ?status=..., so honour the preset. */
    function applyPreset() {
        var preset = (new URLSearchParams(window.location.search).get('status') || '').toUpperCase();
        var allowed = ['PENDING_REVIEW', 'APPROVED', 'CHANGES_REQUESTED', 'REJECTED', 'ALL'];
        if (allowed.indexOf(preset) === -1) return;
        state.status = preset;
        var select = document.getElementById('statusFilter');
        if (select) select.value = preset;
    }

    document.addEventListener('enuvex:ready', async function () {
        document.getElementById('jobSearch').addEventListener('input', function () {
            state.query = this.value.trim().toLowerCase();
            state.page = 0;
            render();
        });
        document.getElementById('statusFilter').addEventListener('change', function () {
            state.status = this.value;
            state.page = 0;
            render();
        });
        document.getElementById('municipalityFilter').addEventListener('change', function () {
            state.municipality = this.value;
            state.page = 0;
            render();
        });
        document.getElementById('typeFilter').addEventListener('change', function () {
            state.type = this.value;
            state.page = 0;
            render();
        });

        document.getElementById('pager').addEventListener('click', function (event) {
            var button = event.target.closest('[data-page]');
            if (!button) return;
            state.page += button.getAttribute('data-page') === 'next' ? 1 : -1;
            render();
        });

        document.getElementById('jobTable').addEventListener('click', function (event) {
            var details = event.target.closest('[data-details]');
            if (details) { openDetails(details.getAttribute('data-details')); return; }

            var approveButton = event.target.closest('[data-approve]');
            if (approveButton) { approve(approveButton.getAttribute('data-approve'), approveButton); return; }

            var rejectButton = event.target.closest('[data-reject]');
            if (rejectButton) { reject(rejectButton.getAttribute('data-reject'), rejectButton); return; }

            var changesButton = event.target.closest('[data-changes]');
            if (changesButton) { requestChanges(changesButton.getAttribute('data-changes'), changesButton); return; }

            var restoreButton = event.target.closest('[data-restore]');
            if (restoreButton) { restore(restoreButton.getAttribute('data-restore'), restoreButton); }
        });

        document.getElementById('closeJobModal').addEventListener('click', function () {
            document.getElementById('jobModal').hidden = true;
        });
        document.getElementById('dismissJobModal').addEventListener('click', function () {
            document.getElementById('jobModal').hidden = true;
        });
        document.getElementById('jobModal').addEventListener('click', function (event) {
            if (event.target === this) this.hidden = true;
        });

        applyPreset();
        await load();
    }, { once: true });
})();
</script>
</body>
</html>
