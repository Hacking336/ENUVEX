<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>User Management — JSM</title>
    <link rel="icon" type="image/svg+xml" href="../assets/brand/jsm-favicon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="../assets/brand/jsm-icon-192.png">
    <link rel="apple-touch-icon" href="../assets/brand/jsm-icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://enuvex.onrender.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../job-seeker/enuvex-app.css">
    <link rel="stylesheet" href="../assets/css/enuvex-role.css">
    <script>
        window.ENUVEX_PAGE = {
            active: 'users',
            title: 'User Management',
            subtitle: 'Every registered account on the platform'
        };
    </script>
</head>
<body data-role="admin">
<div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="side-overlay" id="sideOverlay"></div>

    <div class="main">
        <header class="topbar" id="topbar"></header>

        <main class="content">
            <div class="page-head">
                <div>
                    <h2>All users</h2>
                    <p>Search by email, filter by role or status, and activate or deactivate an account.</p>
                </div>
                <div class="page-head-actions">
                    <span class="badge-neutral" id="totalBadge">0 accounts</span>
                </div>
            </div>

            <div class="alert" id="pageError" hidden>
                <i class="fas fa-circle-exclamation"></i>
                <span id="pageErrorText">Could not load users.</span>
            </div>

            <div class="card rv-toolbar">
                <label class="field" for="userSearch">
                    <i class="fas fa-magnifying-glass"></i>
                    <input type="search" id="userSearch" placeholder="Search by email">
                </label>
                <div class="form-field">
                    <label for="roleFilter">Role</label>
                    <select id="roleFilter">
                        <option value="ALL">All roles</option>
                        <option value="JOB_SEEKER">Job seeker</option>
                        <option value="EMPLOYER">Employer</option>
                        <option value="ADMIN">Admin</option>
                    </select>
                </div>
                <div class="form-field">
                    <label for="statusFilter">Status</label>
                    <select id="statusFilter">
                        <option value="ALL">All statuses</option>
                        <option value="ACTIVE">Active</option>
                        <option value="INACTIVE">Inactive</option>
                    </select>
                </div>
                <span class="rv-spacer"></span>
                <span class="muted" id="resultCount"></span>
            </div>

            <div id="userTable">
                <div class="loading">Loading users…</div>
            </div>

            <div class="pagination" id="pager" hidden></div>
        </main>
    </div>
</div>

<div class="modal" id="userModal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="userModalTitle">
        <div class="modal-head">
            <h3 id="userModalTitle">Account details</h3>
            <button class="modal-close" type="button" id="closeUserModal" aria-label="Close"><i class="fas fa-xmark"></i></button>
        </div>
        <div class="modal-body" id="userModalBody"></div>
        <div class="modal-foot">
            <button class="btn-soft" type="button" id="dismissUserModal">Close</button>
        </div>
    </div>
</div>

<nav class="bottom-nav" id="bottomNav" aria-label="Quick navigation"></nav>
<div class="toast-container" id="toastContainer" aria-live="polite"></div>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/role-app.js"></script>
<script>
(function () {
    'use strict';

    var PAGE_SIZE = 12;
    var state = { users: [], query: '', role: 'ALL', status: 'ALL', page: 0 };

    function showError(message) {
        var box = document.getElementById('pageError');
        var text = document.getElementById('pageErrorText');
        if (!box || !text) return;
        text.textContent = message;
        box.hidden = false;
    }

    function roleBadge(role) {
        var label = role === 'JOB_SEEKER' ? 'Job seeker' : role === 'EMPLOYER' ? 'Employer' : role === 'ADMIN' ? 'Admin' : role;
        var cls = role === 'ADMIN' ? 'badge-neutral' : role === 'EMPLOYER' ? 'badge-wait' : 'badge-ok';
        return '<span class="' + cls + '">' + ROLE.esc(label) + '</span>';
    }

    function filtered() {
        return state.users.filter(function (user) {
            if (state.role !== 'ALL' && String(user.userType) !== state.role) return false;
            if (state.status === 'ACTIVE' && !user.active) return false;
            if (state.status === 'INACTIVE' && user.active) return false;
            if (!state.query) return true;
            var haystack = [user.email, user.businessName, user.employerName, user.fullName]
                .filter(Boolean).join(' ').toLowerCase();
            return haystack.indexOf(state.query) !== -1;
        }).sort(function (a, b) {
            return new Date(b.createdAt || 0) - new Date(a.createdAt || 0);
        });
    }

    function render() {
        var list = filtered();
        var pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
        if (state.page >= pages) state.page = pages - 1;

        var slice = list.slice(state.page * PAGE_SIZE, (state.page + 1) * PAGE_SIZE);
        document.getElementById('resultCount').textContent = list.length + ' shown from ' + state.users.length + ' accounts';
        document.getElementById('totalBadge').textContent = state.users.length + ' accounts';

        var container = document.getElementById('userTable');
        if (!state.users.length) {
            container.innerHTML = `<div class="card panel"><div class="empty">
                <i class="fas fa-users"></i>
                <strong>No user accounts found</strong>
                <p>Registered accounts will appear here.</p>
            </div></div>`;
            document.getElementById('pager').hidden = true;
            return;
        }

        if (!slice.length) {
            container.innerHTML = `<div class="card panel"><div class="empty">
                <i class="fas fa-filter"></i>
                <strong>No accounts match this filter</strong>
                <p>Try another role, status, or search term.</p>
            </div></div>`;
            document.getElementById('pager').hidden = true;
            return;
        }

        container.innerHTML = `<div class="table-wrap">
            <table class="data-table">
                <thead>
                    <tr>
                        <th class="num">#</th>
                        <th>Account</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Registered</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    ${slice.map(function (user, index) {
                        var number = state.page * PAGE_SIZE + index + 1;
                        return `<tr>
                            <td class="num">${number}</td>
                            <td>
                                <span class="cell-main">${ROLE.esc(user.email || 'No email')}</span>
                                <span class="cell-sub">ID ${ROLE.esc(String(user.id))}</span>
                            </td>
                            <td>${roleBadge(user.userType)}</td>
                            <td>
                                <span class="${user.active ? 'badge-ok' : 'badge-off'}">
                                    <i class="fas ${user.active ? 'fa-circle-check' : 'fa-circle-minus'}"></i>
                                    ${user.active ? 'Active' : 'Inactive'}
                                </span>
                            </td>
                            <td>${ROLE.esc(ROLE.dateLabel(user.createdAt))}</td>
                            <td>
                                <div class="row-actions">
                                    <button class="btn-soft btn-sm" type="button" data-view="${ROLE.esc(String(user.id))}">View</button>
                                    ${user.active
                                        ? `<button class="btn-danger btn-sm" type="button" data-suspend="${ROLE.esc(String(user.id))}">Suspend</button>`
                                        : `<button class="btn-solid btn-sm" type="button" data-restore="${ROLE.esc(String(user.id))}">Restore</button>`}
                                </div>
                            </td>
                        </tr>`;
                    }).join('')}
                </tbody>
            </table>
        </div>`;

        var pager = document.getElementById('pager');
        if (pages <= 1) {
            pager.hidden = true;
        } else {
            pager.hidden = false;
            pager.innerHTML = `<button class="btn-soft btn-sm" type="button" data-page="prev" ${state.page === 0 ? 'disabled' : ''}>
                    <i class="fas fa-chevron-left"></i> Previous</button>
                <span class="muted">Page ${state.page + 1} of ${pages}</span>
                <button class="btn-soft btn-sm" type="button" data-page="next" ${state.page >= pages - 1 ? 'disabled' : ''}>
                    Next <i class="fas fa-chevron-right"></i></button>`;
        }
    }

    function verificationLabel(value) {
        if (!value) return '—';
        return String(value).toLowerCase().replace(/_/g, ' ').replace(/^./, function (c) { return c.toUpperCase(); });
    }

    async function openUser(id) {
        var user = state.users.filter(function (item) { return String(item.id) === String(id); })[0];
        if (!user) return;
        document.getElementById('userModalTitle').textContent = user.businessName || user.fullName || user.email || 'Account details';

        var profileRows = '';
        if (user.userType === 'EMPLOYER') {
            profileRows =
                '<div class="kv"><span>Company</span><strong>' + ROLE.esc(user.businessName || '—') + '</strong></div>' +
                '<div class="kv"><span>Contact person</span><strong>' + ROLE.esc(user.employerName || '—') + '</strong></div>' +
                '<div class="kv"><span>Verification</span><strong>' + ROLE.esc(verificationLabel(user.verificationStatus)) + '</strong></div>';
        } else if (user.userType === 'JOB_SEEKER') {
            profileRows = '<div class="kv"><span>Full name</span><strong>' + ROLE.esc(user.fullName || '—') + '</strong></div>';
        }

        document.getElementById('userModalBody').innerHTML = `<div class="kv-grid">
            <div class="kv"><span>Account ID</span><strong>${ROLE.esc(String(user.id))}</strong></div>
            <div class="kv"><span>Email</span><strong>${ROLE.esc(user.email || '—')}</strong></div>
            <div class="kv"><span>Role</span><strong>${ROLE.esc(String(user.userType || '').replace(/_/g, ' '))}</strong></div>
            <div class="kv"><span>Status</span><strong>${user.active ? 'Active' : 'Suspended'}</strong></div>
            <div class="kv"><span>Verified</span><strong>${user.verified ? 'Yes' : 'No'}</strong></div>
            <div class="kv"><span>Municipality</span><strong>${ROLE.esc(ROLE.municipalityLabel(user.municipality) || '—')}</strong></div>
            ${profileRows}
            <div class="kv"><span>Registered</span><strong>${ROLE.esc(ROLE.dateLabel(user.createdAt))}</strong></div>
        </div>
        <div style="margin-top: 16px;">
            <p class="block-title">Moderation history</p>
            <div id="userHistory"><div class="loading">Loading history…</div></div>
        </div>`;
        document.getElementById('userModal').hidden = false;

        var historyResult = await ROLE.safe(ApiClient.getAuditLogs({ targetId: user.id }));
        var historyBox = document.getElementById('userHistory');
        if (!historyBox) return;
        if (ROLE.failed(historyResult) || !Array.isArray(historyResult) || !historyResult.length) {
            historyBox.innerHTML = '<p class="muted">No moderation actions recorded for this account.</p>';
            return;
        }
        historyBox.innerHTML = '<div class="stack">' + historyResult.map(function (entry) {
            return '<div class="list-row">'
                + '<div class="list-body">'
                + '<h4>' + ROLE.esc(entry.actionType || 'Action') + '</h4>'
                + '<div class="list-meta"><span><i class="fas fa-user-shield"></i>' + ROLE.esc(entry.adminUserEmail || 'Unknown administrator') + '</span>'
                + '<span><i class="fas fa-calendar"></i>' + ROLE.esc(ROLE.dateLabel(entry.createdAt)) + '</span></div>'
                + (entry.reason ? '<p class="muted">' + ROLE.esc(entry.reason) + '</p>' : '')
                + '</div></div>';
        }).join('') + '</div>';
    }

    async function load() {
        var result = await ROLE.safe(ApiClient.getAdminUsers());
        if (ROLE.failed(result)) {
            showError(result.__error);
            document.getElementById('userTable').innerHTML = `<div class="card panel"><div class="empty">
                <i class="fas fa-triangle-exclamation"></i>
                <strong>Users unavailable</strong>
                <p>The account list could not be loaded.</p>
            </div></div>`;
            return;
        }
        state.users = Array.isArray(result) ? result : [];
        render();
    }

    /** Dashboard cards link here with ?status=INACTIVE, so honour the preset. */
    function applyPreset() {
        var preset = (new URLSearchParams(window.location.search).get('status') || '').toUpperCase();
        if (preset !== 'ACTIVE' && preset !== 'INACTIVE') return;
        state.status = preset;
        var select = document.getElementById('statusFilter');
        if (select) select.value = preset;
    }

    document.addEventListener('enuvex:ready', async function () {
        document.getElementById('userSearch').addEventListener('input', function () {
            state.query = this.value.trim().toLowerCase();
            state.page = 0;
            render();
        });
        document.getElementById('roleFilter').addEventListener('change', function () {
            state.role = this.value;
            state.page = 0;
            render();
        });
        document.getElementById('statusFilter').addEventListener('change', function () {
            state.status = this.value;
            state.page = 0;
            render();
        });

        document.getElementById('pager').addEventListener('click', function (event) {
            var button = event.target.closest('[data-page]');
            if (!button) return;
            state.page += button.getAttribute('data-page') === 'next' ? 1 : -1;
            render();
        });

        document.getElementById('userTable').addEventListener('click', async function (event) {
            var view = event.target.closest('[data-view]');
            if (view) {
                openUser(view.getAttribute('data-view'));
                return;
            }
            var suspend = event.target.closest('[data-suspend]');
            if (suspend) {
                var reason = prompt('Reason for suspending this account (required, sent to the account holder):');
                if (reason === null || reason.trim() === '') return;
                if (!confirm('Suspend this account? Their applications, job posts and notifications are kept.')) return;
                suspend.disabled = true;
                try {
                    await ApiClient.suspendUser(suspend.getAttribute('data-suspend'), reason);
                    ROLE.toast('Account suspended.', 'success');
                    await load();
                } catch (error) {
                    ROLE.toast(error.message || 'Could not suspend this account.', 'error');
                    suspend.disabled = false;
                }
                return;
            }

            var restore = event.target.closest('[data-restore]');
            if (restore) {
                if (!confirm('Restore this account so the holder can sign in again?')) return;
                restore.disabled = true;
                try {
                    await ApiClient.restoreUser(restore.getAttribute('data-restore'));
                    ROLE.toast('Account restored.', 'success');
                    await load();
                } catch (error) {
                    ROLE.toast(error.message || 'Could not restore this account.', 'error');
                    restore.disabled = false;
                }
            }
        });

        document.getElementById('closeUserModal').addEventListener('click', function () {
            document.getElementById('userModal').hidden = true;
        });
        document.getElementById('dismissUserModal').addEventListener('click', function () {
            document.getElementById('userModal').hidden = true;
        });
        document.getElementById('userModal').addEventListener('click', function (event) {
            if (event.target === this) this.hidden = true;
        });

        applyPreset();
        await load();
    }, { once: true });
})();
</script>
</body>
</html>
