<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Management - Job & Skills Matching System</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <div class="sidebar-logo-icon">
                        <i class="fas fa-building"></i>
                    </div>
                    <span>Employer</span>
                </div>
            </div>

            <nav class="sidebar-nav" id="sidebarNav">
                <!-- Injected by layout.js -->
            </nav>

            <div class="sidebar-footer">
                <div class="sidebar-user" onclick="window.location.href='profile.html'">
                    <div class="sidebar-user-avatar">JE</div>
                    <div class="sidebar-user-info">
                        <div class="sidebar-user-name">Juan's Eatery</div>
                        <div class="sidebar-user-role">Employer</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Sidebar Overlay -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Top Header -->
            <header class="top-header">
                <div class="top-header-content">
                    <div class="top-header-left">
                        <button class="mobile-menu-btn" id="mobileMenuBtn">
                            <i class="fas fa-bars"></i>
                        </button>
                        <h1 class="top-header-title">My Jobs</h1>
                    </div>
                    <div class="top-header-right">
                        <button class="header-btn" id="notificationBtn">
                            <i class="fas fa-bell"></i>
                            <span class="badge">5</span>
                        </button>
                        <button class="header-btn" id="userMenuBtn">
                            <i class="fas fa-user-circle"></i>
                        </button>
                    </div>
                </div>
            </header>

            <!-- Page Content -->
            <main class="page-content">
                <!-- Page Nav -->
                <nav class="page-nav">
                    <a href="dashboard.html"><i class="fas fa-home"></i> Dashboard</a>
                    <span style="color: var(--gray-300);">/</span>
                    <span class="current">My Jobs</span>
                </nav>

                <!-- Tabs -->
                <div class="tab-nav" id="jobTabs">
                    <button class="tab-btn active" data-tab="active">Active <span class="badge" style="background: rgba(42,157,143,0.1); color: #2a9d8f; font-size: 0.7rem; margin-left: 0.35rem;">6</span></button>
                    <button class="tab-btn" data-tab="draft">Draft <span class="badge" style="background: var(--gray-200); color: var(--gray-600); font-size: 0.7rem; margin-left: 0.35rem;">2</span></button>
                    <button class="tab-btn" data-tab="closed">Closed <span class="badge" style="background: var(--gray-200); color: var(--gray-600); font-size: 0.7rem; margin-left: 0.35rem;">3</span></button>
                </div>

                <!-- Add Job Button -->
                <div class="d-flex justify-content-end mb-4">
                    <a href="post-job.html" class="btn btn-primary" style="background: linear-gradient(135deg, #7e57c2, #b39ddb);">
                        <i class="fas fa-plus" style="margin-right: 0.5rem;"></i> Post New Job
                    </a>
                </div>

                <!-- Jobs Container -->
                <div id="jobsContainer">
                    <!-- Rendered by JS -->
                </div>
            </main>
        </div>
    </div>

    <!-- Bottom Navigation (Mobile) -->
    <nav class="bottom-nav" id="bottomNav">
        <!-- Injected by layout.js -->
    </nav>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script>
        // Jobs Data
        const jobsData = {
            active: [
                {
                    id: 1,
                    title: 'Restaurant Crew',
                    location: 'Daet, Camarines Norte',
                    applicants: 12,
                    shortlisted: 3,
                    status: 'Active',
                    posted: '2 days ago',
                    icon: 'fa-utensils',
                    iconClass: 'alt',
                    views: 156
                },
                {
                    id: 2,
                    title: 'Pharmacy Assistant',
                    location: 'Daet, Camarines Norte',
                    applicants: 8,
                    shortlisted: 2,
                    status: 'Active',
                    posted: '5 days ago',
                    icon: 'fa-pills',
                    iconClass: 'third',
                    views: 89
                },
                {
                    id: 3,
                    title: 'Sales Associate',
                    location: 'Basud, Camarines Norte',
                    applicants: 15,
                    shortlisted: 4,
                    status: 'Active',
                    posted: '1 week ago',
                    icon: 'fa-shopping-cart',
                    iconClass: 'fourth',
                    views: 203
                },
                {
                    id: 4,
                    title: 'Driver / Delivery',
                    location: 'Daet, Camarines Norte',
                    applicants: 6,
                    shortlisted: 2,
                    status: 'Active',
                    posted: '3 days ago',
                    icon: 'fa-truck',
                    iconClass: '',
                    views: 67
                },
                {
                    id: 5,
                    title: 'Construction Worker',
                    location: 'Labo, Camarines Norte',
                    applicants: 22,
                    shortlisted: 5,
                    status: 'Active',
                    posted: '1 week ago',
                    icon: 'fa-hard-hat',
                    iconClass: 'alt',
                    views: 178
                },
                {
                    id: 6,
                    title: 'Admin Staff',
                    location: 'Vinzons, Camarines Norte',
                    applicants: 9,
                    shortlisted: 1,
                    status: 'Active',
                    posted: '4 days ago',
                    icon: 'fa-file-alt',
                    iconClass: 'third',
                    views: 94
                }
            ],
            draft: [
                {
                    id: 7,
                    title: 'Kitchen Helper',
                    location: 'Vinzons, Camarines Norte',
                    applicants: 0,
                    shortlisted: 0,
                    status: 'Draft',
                    posted: 'Draft saved 2 days ago',
                    icon: 'fa-utensils',
                    iconClass: 'alt',
                    views: 0
                },
                {
                    id: 8,
                    title: 'Warehouse Assistant',
                    location: 'Basud, Camarines Norte',
                    applicants: 0,
                    shortlisted: 0,
                    status: 'Draft',
                    posted: 'Draft saved 1 week ago',
                    icon: 'fa-boxes',
                    iconClass: '',
                    views: 0
                }
            ],
            closed: [
                {
                    id: 9,
                    title: 'Cashier',
                    location: 'Daet, Camarines Norte',
                    applicants: 18,
                    shortlisted: 5,
                    hired: 2,
                    status: 'Closed',
                    posted: 'Closed 2 weeks ago',
                    icon: 'fa-cash-register',
                    iconClass: '',
                    views: 234
                },
                {
                    id: 10,
                    title: 'Security Guard',
                    location: 'Daet, Camarines Norte',
                    applicants: 14,
                    shortlisted: 3,
                    hired: 1,
                    status: 'Closed',
                    posted: 'Closed 1 month ago',
                    icon: 'fa-shield-alt',
                    iconClass: 'third',
                    views: 167
                },
                {
                    id: 11,
                    title: 'Teacher / Tutor',
                    location: 'Vinzons, Camarines Norte',
                    applicants: 7,
                    shortlisted: 2,
                    hired: 1,
                    status: 'Closed',
                    posted: 'Closed 3 weeks ago',
                    icon: 'fa-chalkboard-teacher',
                    iconClass: 'fourth',
                    views: 89
                }
            ]
        };

        let currentTab = 'active';

        function getStatusClass(status) {
            const classes = {
                'Active': 'status-accepted',
                'Draft': 'status-applied',
                'Closed': 'status-rejected'
            };
            return classes[status] || 'status-applied';
        }

        function renderJobs() {
            const container = document.getElementById('jobsContainer');
            if (!container) return;

            const jobs = jobsData[currentTab] || [];

            if (jobs.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon"><i class="fas fa-briefcase"></i></div>
                        <h4>No jobs found</h4>
                        <p>No ${currentTab} jobs at the moment</p>
                        ${currentTab !== 'active' ? '<a href="post-job.html" class="btn btn-primary mt-3"><i class="fas fa-plus"></i> Post a Job</a>' : ''}
                    </div>
                `;
                return;
            }

            container.innerHTML = jobs.map(job => `
                <div class="card job-card fade-in">
                    <div class="job-card-icon ${job.iconClass || ''}">
                        <i class="fas ${job.icon}"></i>
                    </div>
                    <div class="job-card-info">
                        <div class="job-card-title">${job.title}</div>
                        <div class="job-card-company">Juan's Eatery</div>
                        <div class="job-card-meta">
                            <span><i class="fas fa-map-marker-alt"></i> ${job.location}</span>
                            <span><i class="fas fa-users"></i> ${job.applicants} Applicants</span>
                            ${job.shortlisted !== undefined ? `<span><i class="fas fa-star-half-alt"></i> ${job.shortlisted} Shortlisted</span>` : ''}
                            ${job.hired !== undefined ? `<span><i class="fas fa-check-circle"></i> ${job.hired} Hired</span>` : ''}
                            <span><i class="fas fa-eye"></i> ${job.views} Views</span>
                        </div>
                        <div class="job-card-tags">
                            <span class="job-tag ${getStatusClass(job.status).replace('status-', '')}">${job.status}</span>
                            <span class="job-tag">${job.posted}</span>
                        </div>
                    </div>
                    <div class="job-card-actions">
                        ${currentTab === 'active' ? `
                            <button class="btn btn-outline btn-sm" onclick="event.stopPropagation(); window.location.href='applicants.html?jobId=${job.id}'"><i class="fas fa-users"></i> Applicants</button>
                            <button class="btn btn-primary btn-sm" onclick="event.stopPropagation(); window.location.href='edit-job.html?id=${job.id}'"><i class="fas fa-edit"></i> Edit</button>
                        ` : currentTab === 'draft' ? `
                            <button class="btn btn-primary btn-sm" onclick="event.stopPropagation(); window.location.href='post-job.html?edit=${job.id}'"><i class="fas fa-edit"></i> Complete & Publish</button>
                            <button class="btn btn-outline btn-sm" onclick="event.stopPropagation(); deleteDraft(${job.id})"><i class="fas fa-trash"></i> Delete</button>
                        ` : `
                            <button class="btn btn-outline btn-sm" onclick="event.stopPropagation(); window.location.href='applicants.html?jobId=${job.id}'"><i class="fas fa-users"></i> View Results</button>
                            <button class="btn btn-outline btn-sm" onclick="event.stopPropagation(); repostJob(${job.id})"><i class="fas fa-redo"></i> Repost</button>
                        `}
                    </div>
                </div>
            `).join('');
        }

        // Tab switching
        document.addEventListener('DOMContentLoaded', function() {
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    tabs.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    currentTab = this.dataset.tab;
                    renderJobs();
                });
            });

            // Initial render
            renderJobs();
        });

        function deleteDraft(jobId) {
            if (confirm('Are you sure you want to delete this draft?')) {
                showToast('Draft deleted', 'success');
            }
        }

        function repostJob(jobId) {
            showToast('Job reposted as new listing!', 'success');
        }

        // Ensure user type is stored for proper sidebar detection
        localStorage.setItem('userType', 'EMPLOYER');
    </script>
    <script src="../assets/js/layout.js"></script>
</body>
</html>
