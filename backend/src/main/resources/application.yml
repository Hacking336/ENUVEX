# Database credentials and the JWT secret come from the environment.
# For local runs, copy backend/.env.example to backend/.env - it is read
# automatically and is git-ignored.
spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    # Supabase Postgres. currentSchema keeps this app's tables in their own
    # schema so they cannot collide with another application's tables in the
    # same database.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=enuv}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5
      minimum-idle: 1
      pool-name: JobSkillsPool
      max-lifetime: 600000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: enuv
        format_sql: true
        use_sql_comments: true
        generate_statistics: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: enuv
    default-schema: enuv
    create-schemas: true
    baseline-on-migrate: true
    baseline-version: 0
    # Never allow "flyway clean" to drop every table.
    clean-disabled: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
      enabled: true

jwt:
  # No default value on purpose: the app fails to start if JWT_SECRET is missing,
  # instead of silently signing tokens with a key that is public in this repo.
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8080
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024
  error:
    whitelabel:
      enabled: false

logging:
  level:
    root: INFO
    com.jobskills: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      clean-history-on-start: false
