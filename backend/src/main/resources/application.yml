# Database credentials and the JWT secret come from the environment.
# For local runs, copy backend/.env.example to backend/.env - it is read
# automatically and is git-ignored.
spring:
  config:
    import: optional:file:.env[.properties]

  datasource:
    # Supabase Postgres. currentSchema keeps this app's tables in their own
    # schema so they cannot collide with another application's tables in the
    # same database.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/postgres?currentSchema=enuv}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5
      minimum-idle: 1
      pool-name: JobSkillsPool
      max-lifetime: 600000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: enuv
        format_sql: true
        use_sql_comments: true
        generate_statistics: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: enuv
    default-schema: enuv
    create-schemas: true
    baseline-on-migrate: true
    baseline-version: 0
    # Never allow "flyway clean" to drop every table.
    clean-disabled: true

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB
      enabled: true

jwt:
  # No default value on purpose: the app fails to start if JWT_SECRET is missing,
  # instead of silently signing tokens with a key that is public in this repo.
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION_MS:3600000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION_MS:604800000}

# Map tiles are configuration, not code: a deployment can point every JSM map at
# another OpenStreetMap-compatible provider by setting these variables. The
# default is OpenStreetMap's public tile service, which is usage-limited and
# offered without an uptime guarantee, so production traffic should use a
# provider that allows it (or a self-hosted tile server).
jsm:
  map:
    tile-url: ${JSM_MAP_TILE_URL:https://tile.openstreetmap.org/{z}/{x}/{y}.png}
    attribution: ${JSM_MAP_ATTRIBUTION:&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors}
    min-zoom: ${JSM_MAP_MIN_ZOOM:8}
    max-zoom: ${JSM_MAP_MAX_ZOOM:18}
    center-lat: ${JSM_MAP_CENTER_LAT:14.1290}
    center-lng: ${JSM_MAP_CENTER_LNG:122.9200}
    zoom: ${JSM_MAP_ZOOM:10}

  # Persistent rate limiting for the write endpoints an unauthenticated script can
  # hammer. Counters live in the rate_limit_counters table (migration V9), so they
  # survive restarts and are shared by every instance. Limits are per client
  # address and deliberately generous; 0 disables an individual limit, and
  # jsm.rate-limit.enabled=false disables the limiter entirely.
  rate-limit:
    enabled: ${JSM_RATE_LIMIT_ENABLED:true}
    login-limit: ${JSM_RATE_LIMIT_LOGIN:20}
    login-window-seconds: ${JSM_RATE_LIMIT_LOGIN_WINDOW:60}
    registration-limit: ${JSM_RATE_LIMIT_REGISTRATION:10}
    registration-window-seconds: ${JSM_RATE_LIMIT_REGISTRATION_WINDOW:3600}
    report-limit: ${JSM_RATE_LIMIT_REPORTS:10}
    report-window-seconds: ${JSM_RATE_LIMIT_REPORTS_WINDOW:3600}
    application-limit: ${JSM_RATE_LIMIT_APPLICATIONS:30}
    application-window-seconds: ${JSM_RATE_LIMIT_APPLICATIONS_WINDOW:3600}

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  # Hosting platforms inject the port they want the app to listen on.
  port: ${PORT:8080}
  servlet:
    context-path: /
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    min-response-size: 1024
  error:
    whitelabel:
      enabled: false

logging:
  level:
    root: INFO
    com.jobskills: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      clean-history-on-start: false
