<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Job & Skills Matching System</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-page">
    <div class="login-card">
        <div class="login-logo">
            <div class="login-logo-icon">
                <i class="fas fa-handshake"></i>
            </div>
            <h2>Job & Skills Matching System</h2>
            <p>Connecting Local Talent with Local Opportunities</p>
        </div>

        <div class="text-center mb-4">
            <h3>Choose Your Account Type</h3>
            <p class="text-muted">Select whether you're a job seeker or an employer</p>
        </div>

        <div class="row g-3">
            <div class="col-12">
                <a href="job-seeker/register.html" class="btn btn-primary btn-block btn-lg">
                    <i class="fas fa-user-tie me-2"></i> Create Job Seeker Account
                </a>
            </div>
            <div class="col-12">
                <a href="employer/register.html" class="btn btn-outline btn-block btn-lg">
                    <i class="fas fa-building me-2"></i> Create Employer Account
                </a>
            </div>
        </div>

        <div class="mt-4 text-center">
            <a href="index.html" class="text-decoration-none small">
                <i class="fas fa-arrow-left me-1"></i> Back to Login
            </a>
        </div>

        <div class="mt-4 text-center">
            <p class="text-muted">© 2026 Job & Skills Matching System. All rights reserved.</p>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
</body>
</html>
