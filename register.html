<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Create Account — JSM</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/auth.css">
    <link rel="stylesheet" href="assets/brand/brand.css">
    <link rel="icon" type="image/svg+xml" href="assets/brand/jsm-favicon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="assets/brand/jsm-icon-192.png">
    <link rel="apple-touch-icon" href="assets/brand/jsm-icon-192.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-page">
    <div class="login-card">
        <div class="login-logo">
            <img class="jsm-auth-mark" src="assets/brand/jsm-icon.svg" alt="JSM" width="56" height="56">
            <h2>JSM</h2>
            <p>Job &amp; Skills Matching — connecting local talent with local opportunities</p>
        </div>

        <div class="text-center mb-4">
            <h3>Choose Your Account Type</h3>
            <p class="text-muted">Select whether you're a job seeker or an employer</p>
        </div>

        <div class="row g-3">
            <div class="col-12">
                <a href="job-seeker/register.html" class="btn btn-primary btn-block btn-lg">
                    <i class="fas fa-user-tie me-2"></i> Create Job Seeker Account
                </a>
            </div>
            <div class="col-12">
                <a href="employer/register.html" class="btn btn-outline btn-block btn-lg">
                    <i class="fas fa-building me-2"></i> Create Employer Account
                </a>
            </div>
        </div>

        <div class="mt-4 text-center">
            <a href="login.html" class="text-decoration-none small">
                <i class="fas fa-arrow-left me-1"></i> Back to Login
            </a>
        </div>

        <div class="mt-4 text-center">
            <p class="text-muted">© 2026 JSM — Job &amp; Skills Matching. All rights reserved.</p>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
</body>
</html>
