<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Applications — JSM</title>
    <link rel="icon" type="image/svg+xml" href="../assets/brand/jsm-favicon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="../assets/brand/jsm-icon-192.png">
    <link rel="apple-touch-icon" href="../assets/brand/jsm-icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="enuvex-app.css">
    <script>
        window.ENUVEX_PAGE = {
            active: 'applications',
            title: 'Applications',
            subtitle: 'Track every job you have applied to and where it stands'
        };
    </script>
</head>
<body>
<div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="side-overlay" id="sideOverlay"></div>

    <div class="main">
        <header class="topbar" id="topbar"></header>

        <main class="content">
            <div class="alert" id="pageError" hidden>
                <i class="fas fa-circle-exclamation"></i>
                <span id="pageErrorText">Could not load your applications.</span>
            </div>

            <section class="metrics" id="summaryMetrics" aria-label="Application summary">
                <article class="metric">
                    <div class="metric-icon"><i class="fas fa-file-lines"></i></div>
                    <div>
                        <div class="metric-value" id="metricTotal">—</div>
                        <div class="metric-label">Total Applications</div>
                        <div class="metric-desc">Every job you applied to</div>
                    </div>
                </article>
                <article class="metric">
                    <div class="metric-icon"><i class="fas fa-hourglass-half"></i></div>
                    <div>
                        <div class="metric-value" id="metricProgress">—</div>
                        <div class="metric-label">In Progress</div>
                        <div class="metric-desc">Applied, under review or shortlisted</div>
                    </div>
                </article>
                <article class="metric">
                    <div class="metric-icon"><i class="fas fa-comments"></i></div>
                    <div>
                        <div class="metric-value" id="metricInterview">—</div>
                        <div class="metric-label">Interviews</div>
                        <div class="metric-desc">Employers who invited you</div>
                    </div>
                </article>
                <article class="metric">
                    <div class="metric-icon"><i class="fas fa-circle-check"></i></div>
                    <div>
                        <div class="metric-value" id="metricAccepted">—</div>
                        <div class="metric-label">Offered</div>
                        <div class="metric-desc">Applications accepted</div>
                    </div>
                </article>
            </section>

            <div class="tabs" id="statusTabs" role="tablist" aria-label="Filter applications by status">
                <button class="tab is-active" type="button" data-status="ALL" role="tab" aria-selected="true">All <span class="count" id="countAll">0</span></button>
                <button class="tab" type="button" data-status="APPLIED" role="tab" aria-selected="false">Applied <span class="count" id="countApplied">0</span></button>
                <button class="tab" type="button" data-status="UNDER_REVIEW" role="tab" aria-selected="false">Under Review <span class="count" id="countReview">0</span></button>
                <button class="tab" type="button" data-status="SHORTLISTED" role="tab" aria-selected="false">Shortlisted <span class="count" id="countShortlisted">0</span></button>
                <button class="tab" type="button" data-status="INTERVIEW" role="tab" aria-selected="false">Interview <span class="count" id="countInterview">0</span></button>
                <button class="tab" type="button" data-status="ACCEPTED" role="tab" aria-selected="false">Accepted <span class="count" id="countAccepted">0</span></button>
                <button class="tab" type="button" data-status="REJECTED" role="tab" aria-selected="false">Rejected <span class="count" id="countRejected">0</span></button>
            </div>

            <div class="app-list" id="applicationList" aria-live="polite">
                <div class="loading">Loading your applications…</div>
            </div>
        </main>
    </div>
</div>

<nav class="bottom-nav" id="bottomNav" aria-label="Quick navigation"></nav>
<div class="toast-container" id="toastContainer" aria-live="polite"></div>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/jsm-match.js"></script>
<script src="enuvex-app.js"></script>
<script>
(function () {
    'use strict';

    var state = { applications: [], status: 'ALL' };

    var el = {
        list: document.getElementById('applicationList'),
        pageError: document.getElementById('pageError'),
        pageErrorText: document.getElementById('pageErrorText')
    };

    function countBy(status) {
        if (status === 'ALL') return state.applications.length;
        return state.applications.filter(function (app) {
            return String(app.status || '').toUpperCase() === status;
        }).length;
    }

    function sortNewestFirst(list) {
        return list.slice().sort(function (a, b) {
            return new Date(b.appliedAt || 0) - new Date(a.appliedAt || 0);
        });
    }

    function card(app) {
        var meta = ENUVEX.statusMeta(app.status);
        var match = Number(app.matchPercentage);
        var title = ENUVEX.esc(app.jobTitle || 'Job');
        var company = ENUVEX.esc(app.companyName || 'Employer');
        var detailsHref = app.jobPostId ? 'job-details.html?id=' + encodeURIComponent(app.jobPostId) : 'jobs.html';

        return `
            <article class="card app-card">
                <div class="app-card-top">
                    <div class="job-icon"><i class="fas fa-briefcase"></i></div>
                    <div class="app-card-main">
                        <div class="job-head">
                            <div>
                                <h3>${title}</h3>
                                <div class="job-company">${company}</div>
                            </div>
                            <span class="status ${meta.cls}">${ENUVEX.esc(meta.label)}</span>
                        </div>
                    </div>
                </div>
                <div class="app-card-bottom">
                    <div class="app-highlights">
                        <span><i class="fas fa-calendar-check"></i>Applied ${ENUVEX.esc(ENUVEX.dateLabel(app.appliedAt) || '—')}</span>
                        ${isFinite(match) && match > 0 ? `<span><i class="fas fa-bullseye"></i>${Math.round(match)}% match</span>` : ''}
                    </div>
                    <a class="btn-ghost btn-sm" href="${detailsHref}"><i class="fas fa-eye"></i> View Details</a>
                </div>
            </article>`;
    }

    function render() {
        var list = sortNewestFirst(state.applications).filter(function (app) {
            return state.status === 'ALL' || String(app.status || '').toUpperCase() === state.status;
        });

        if (!list.length) {
            el.list.innerHTML = state.applications.length
                ? `<div class="empty"><i class="fas fa-filter"></i><strong>No applications with this status</strong>Choose another status to see your other applications.</div>`
                : `<div class="empty"><i class="fas fa-file-lines"></i><strong>No applications yet</strong>Once you apply to a job it will appear here with its live status.<a class="btn-solid btn-sm" href="jobs.html"><i class="fas fa-magnifying-glass"></i> Browse Jobs</a></div>`;
            return;
        }

        el.list.innerHTML = list.map(card).join('');
    }

    function renderSummary() {
        var total = countBy('ALL');
        var accepted = countBy('ACCEPTED');
        document.getElementById('metricTotal').textContent = total;
        document.getElementById('metricProgress').textContent = countBy('APPLIED') + countBy('UNDER_REVIEW') + countBy('SHORTLISTED');
        document.getElementById('metricInterview').textContent = countBy('INTERVIEW');
        document.getElementById('metricAccepted').textContent = accepted;

        document.getElementById('countAll').textContent = total;
        document.getElementById('countApplied').textContent = countBy('APPLIED');
        document.getElementById('countReview').textContent = countBy('UNDER_REVIEW');
        document.getElementById('countShortlisted').textContent = countBy('SHORTLISTED');
        document.getElementById('countInterview').textContent = countBy('INTERVIEW');
        document.getElementById('countAccepted').textContent = accepted;
        document.getElementById('countRejected').textContent = countBy('REJECTED');
    }

    async function loadApplications() {
        el.pageError.hidden = true;

        if (!window.ApiClient || !ApiClient.loadAuth()) {
            state.applications = [];
            renderSummary();
            el.list.innerHTML = `<div class="empty"><i class="fas fa-lock"></i><strong>Sign in to see your applications</strong>Your applications, statuses and match scores appear here after you sign in.<a class="btn-solid btn-sm" href="../../login.html">Sign in</a></div>`;
            return;
        }

        var result = await ENUVEX.safe(ApiClient.getApplications());
        if (ENUVEX.failed(result)) {
            el.pageError.hidden = false;
            el.pageErrorText.textContent = result.__error.message || 'Could not load your applications.';
            el.list.innerHTML = `<div class="empty"><i class="fas fa-triangle-exclamation"></i><strong>Applications could not be loaded</strong>Please refresh the page to try again.</div>`;
            return;
        }

        state.applications = Array.isArray(result) ? result : [];
        renderSummary();
        render();
    }

    document.addEventListener('DOMContentLoaded', function () {
        document.getElementById('statusTabs').addEventListener('click', function (event) {
            var tab = event.target.closest('[data-status]');
            if (!tab) return;
            state.status = tab.getAttribute('data-status');
            document.querySelectorAll('#statusTabs .tab').forEach(function (button) {
                var isActive = button === tab;
                button.classList.toggle('is-active', isActive);
                button.setAttribute('aria-selected', isActive ? 'true' : 'false');
            });
            render();
        });

        loadApplications();
    });
})();
</script>
</body>
</html>
