<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Job Details — JSM</title>
    <link rel="icon" type="image/svg+xml" href="../assets/brand/jsm-favicon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="../assets/brand/jsm-icon-192.png">
    <link rel="apple-touch-icon" href="../assets/brand/jsm-icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="enuvex-app.css">
    <script>
        window.ENUVEX_PAGE = {
            active: 'jobs',
            title: 'Job Details',
            subtitle: 'Full description, requirements and match score'
        };
    </script>
</head>
<body>
<div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="side-overlay" id="sideOverlay"></div>

    <div class="main">
        <header class="topbar" id="topbar"></header>

        <main class="content">
            <div class="alert" id="pageError" hidden>
                <i class="fas fa-circle-exclamation"></i>
                <span id="pageErrorText">Could not load this job.</span>
            </div>

            <a class="link-all" href="jobs.html" style="margin-bottom: 16px; display: inline-flex;">
                <i class="fas fa-arrow-left"></i> Back to search results
            </a>

            <div id="jobContent">
                <div class="card panel"><div class="loading">Loading job details…</div></div>
            </div>
        </main>
    </div>
</div>

<nav class="bottom-nav" id="bottomNav" aria-label="Quick navigation"></nav>
<div class="toast-container" id="toastContainer" aria-live="polite"></div>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/jsm-match.js"></script>
<script src="enuvex-app.js"></script>
<script>
(function () {
    'use strict';

    var el = {
        content: document.getElementById('jobContent'),
        pageError: document.getElementById('pageError'),
        pageErrorText: document.getElementById('pageErrorText')
    };

    function jobId() {
        return new URLSearchParams(window.location.search).get('id') || '';
    }

    function render(job) {
        var location = [ENUVEX.municipalityLabel(job.municipality), job.barangay].filter(Boolean).join(', ');
        var salary = ENUVEX.salaryLabel(job);
        var match = Number(job.matchPercentage);
        var skills = String(job.requiredSkills || '').split(',').map(function (s) { return s.trim(); }).filter(Boolean);

        el.content.innerHTML = `
            <section class="card panel" style="margin-bottom: 18px;">
                <div class="job" style="border: 0; padding: 0 0 18px; border-bottom: 1px solid var(--line); margin-bottom: 18px;">
                    <div class="job-icon" style="width: 56px; height: 56px; font-size: 20px;"><i class="fas ${ENUVEX.jobIcon(job.category)}"></i></div>
                    <div class="job-body">
                        <div class="job-head">
                            <div>
                                <h2 class="job-title" style="font-size: 21px;">${ENUVEX.esc(job.jobTitle || 'Job')}</h2>
                                <div class="job-company" style="font-size: 14px;">${ENUVEX.esc(job.companyName || 'Employer')}</div>
                            </div>
                            ${isFinite(match) && match > 0 && window.JSMMatch ? JSMMatch.pill(match) : ''}
                        </div>
                        <div class="job-meta" style="margin-top: 12px; font-size: 13px;">
                            ${location ? `<span><i class="fas fa-location-dot"></i>${ENUVEX.esc(location)}</span>` : ''}
                            ${salary ? `<span><i class="fas fa-peso-sign"></i>${ENUVEX.esc(salary)}</span>` : ''}
                            <span><i class="fas fa-briefcase"></i>${ENUVEX.esc(ENUVEX.typeLabel(job.employmentType) || 'Not specified')}</span>
                            ${job.createdAt ? `<span><i class="far fa-calendar"></i>${ENUVEX.esc(ENUVEX.postedLabel(job.createdAt))}</span>` : ''}
                        </div>
                    </div>
                </div>

                <div class="job-tags" style="margin: 0 0 18px;">
                    ${job.category ? `<span class="tag type">${ENUVEX.esc(ENUVEX.categoryLabel(job.category))}</span>` : ''}
                    ${job.workSchedule ? `<span class="tag">${ENUVEX.esc(ENUVEX.scheduleLabel(job.workSchedule))}</span>` : ''}
                </div>

                <div style="display: flex; flex-wrap: wrap; gap: 10px;">
                    <button class="btn-solid" type="button" data-apply="${ENUVEX.esc(job.id)}">Apply Now</button>
                    <button class="btn-soft" type="button" data-save="${ENUVEX.esc(job.id)}">
                        <i class="${ENUVEX.isSaved(job.id) ? 'fas' : 'far'} fa-bookmark"></i> ${ENUVEX.isSaved(job.id) ? 'Saved' : 'Save Job'}
                    </button>
                </div>
            </section>

            <div class="profile-grid">
                <div class="profile-main">
                    <section class="card panel">
                        <div class="panel-head"><h3><i class="fas fa-bullseye"></i> Your Match</h3></div>
                        ${window.JSMMatch
                            ? JSMMatch.summaryLine(job) + JSMMatch.skillsBlock(job) + JSMMatch.explanation(job)
                            : '<p class="panel-empty">Match details are unavailable on this page.</p>'}
                    </section>

                    <section class="card panel">
                        <div class="panel-head"><h3><i class="fas fa-align-left"></i> Job Description</h3></div>
                        ${job.description
                            ? `<p class="prose">${ENUVEX.esc(job.description)}</p>`
                            : '<p class="panel-empty">This employer has not added a description yet.</p>'}
                    </section>

                    <section class="card panel">
                        <div class="panel-head"><h3><i class="fas fa-star"></i> Required Skills</h3></div>
                        ${skills.length
                            ? `<div class="chips">${skills.map(function (skill) { return `<span class="chip">${ENUVEX.esc(skill)}</span>`; }).join('')}</div>`
                            : '<p class="panel-empty">No specific skills listed for this job.</p>'}
                    </section>
                </div>

                <aside class="profile-side">
                    <section class="card panel">
                        <div class="panel-head"><h3><i class="fas fa-circle-info"></i> Job Overview</h3></div>
                        <dl class="detail-list">
                            <div class="detail-row"><dt>Employer</dt><dd>${ENUVEX.esc(job.companyName || '—')}</dd></div>
                            <div class="detail-row"><dt>Location</dt><dd>${ENUVEX.esc(location || '—')}</dd></div>
                            <div class="detail-row"><dt>Employment type</dt><dd>${ENUVEX.esc(ENUVEX.typeLabel(job.employmentType) || '—')}</dd></div>
                            <div class="detail-row"><dt>Work schedule</dt><dd>${ENUVEX.esc(ENUVEX.scheduleLabel(job.workSchedule) || '—')}</dd></div>
                            <div class="detail-row"><dt>Salary</dt><dd>${ENUVEX.esc(salary || 'Negotiable')}</dd></div>
                            <div class="detail-row"><dt>Open positions</dt><dd>${ENUVEX.esc(job.availablePositions || 1)}</dd></div>
                            <div class="detail-row"><dt>Posted</dt><dd>${ENUVEX.esc(ENUVEX.dateLabel(job.createdAt) || '—')}</dd></div>
                        </dl>
                    </section>

                    <section class="card panel">
                        <div class="panel-head"><h3><i class="fas fa-lightbulb"></i> Before You Apply</h3></div>
                        <ul class="tips" style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px;">
                            <li style="display: flex; gap: 10px; font-size: 12.5px; line-height: 1.55; color: #4C6274;"><i class="fas fa-circle-check" style="color: var(--green); margin-top: 3px;"></i><span>Make sure your profile lists the skills this job asks for.</span></li>
                            <li style="display: flex; gap: 10px; font-size: 12.5px; line-height: 1.55; color: #4C6274;"><i class="fas fa-circle-check" style="color: var(--green); margin-top: 3px;"></i><span>Check the location — make sure the commute works for you.</span></li>
                            <li style="display: flex; gap: 10px; font-size: 12.5px; line-height: 1.55; color: #4C6274;"><i class="fas fa-circle-check" style="color: var(--green); margin-top: 3px;"></i><span>You can track every application on the Applications page.</span></li>
                        </ul>
                    </section>
                </aside>
            </div>`;
    }

    async function loadJob() {
        var id = jobId();
        el.pageError.hidden = true;

        if (!id) {
            el.pageError.hidden = false;
            el.pageErrorText.textContent = 'No job was selected. Open a job from the search results.';
            el.content.innerHTML = '<div class="empty"><i class="fas fa-briefcase"></i><strong>No job selected</strong><a class="btn-solid btn-sm" href="jobs.html">Browse Jobs</a></div>';
            return;
        }

        if (!window.ApiClient || !ApiClient.loadAuth()) {
            el.content.innerHTML = '<div class="empty"><i class="fas fa-lock"></i><strong>Sign in to view this job</strong><a class="btn-solid btn-sm" href="../../login.html">Sign in</a></div>';
            return;
        }

        var result = await ENUVEX.safe(ApiClient.request('/job-seekers/jobs/' + encodeURIComponent(id)));
        if (ENUVEX.failed(result) || !result) {
            el.pageError.hidden = false;
            el.pageErrorText.textContent = (result && result.__error && result.__error.message) || 'This job could not be found.';
            el.content.innerHTML = '<div class="empty"><i class="fas fa-triangle-exclamation"></i><strong>Job unavailable</strong>It may have been closed by the employer.<a class="btn-solid btn-sm" href="jobs.html">Browse other jobs</a></div>';
            return;
        }

        render(result);
        document.title = (result.jobTitle || 'Job Details') + ' — JSM';
        var subtitle = document.querySelector('.topbar-title p');
        if (subtitle) subtitle.textContent = result.companyName || 'Job details';
    }

    document.addEventListener('DOMContentLoaded', function () {
        ENUVEX.wireJobActions(function (action) {
            if (action === 'saved' || action === 'applied') loadJob();
        });
        loadJob();
    });
})();
</script>
</body>
</html>
