                            </ul>

        let filteredJobs = [...allJobs];
        let currentView = 'list';

        function renderJobs() {
            const container = document.getElementById('jobList');
            const countEl = document.getElementById('jobCount');
            if (!container) return;

            if (countEl) countEl.textContent = filteredJobs.length;

            if (filteredJobs.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon"><i class="fas fa-search"></i></div>
                        <h4>No jobs found</h4>
                        <p>Try adjusting your filters or search terms</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filteredJobs.map(job => `
                <div class="card job-card fade-in ${currentView === 'grid' ? 'grid-view' : ''}" onclick="window.location.href='job-details.html?id=${job.id}'">
                    <div class="job-card-icon ${job.iconClass || ''}">
                        <i class="fas ${job.icon}"></i>
                    </div>
                    <div class="job-card-info">
                        <div class="job-card-title">${job.title}</div>
                        <div class="job-card-company">${job.company}</div>
                        <div class="job-card-meta">
                            <span><i class="fas fa-map-marker-alt"></i> ${job.municipality}, Camarines Norte</span>
                            <span><i class="fas fa-clock"></i> ${job.employmentType}</span>
                            <span><i class="fas fa-tag"></i> ${job.salary}</span>
                            <span><i class="fas fa-clock"></i> ${job.posted}</span>
                        </div>
                        <div class="job-card-tags">
                            ${job.tags.map(tag => `<span class="job-tag">${tag}</span>`).join('')}
                        </div>
                        <div class="match-percentage">
                            <div class="match-circle ${job.match >= 80 ? 'high' : job.match >= 60 ? 'medium' : 'low'}">${job.match}%</div>
                            <div class="match-info">
                                <h4>${job.match >= 80 ? 'Excellent Match' : job.match >= 60 ? 'Good Match' : 'Fair Match'}</h4>
                                <div class="match-bar">
                                    <div class="match-bar-fill ${job.match >= 80 ? 'high' : job.match >= 60 ? 'medium' : 'low'}" style="width: ${job.match}%;"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="job-card-actions">
                        <button class="btn btn-outline btn-sm" onclick="event.stopPropagation(); saveJob(${job.id})"><i class="fas fa-bookmark"></i></button>
                        <button class="btn btn-primary btn-sm" onclick="event.stopPropagation(); applyJob(${job.id})"><i class="fas fa-paper-plane"></i> Apply</button>
                    </div>
                </div>
            `).join('');
        }

        function applyFilters() {
            const form = document.getElementById('jobFilterForm');
            if (!form) return;

            const formData = new FormData(form);
            const selectedMunicipalities = formData.getAll('municipality').filter(v => v);
            const selectedCategories = formData.getAll('category').filter(v => v);
            const selectedEmploymentTypes = formData.getAll('employmentType').filter(v => v);
            const selectedWorkSchedules = formData.getAll('workSchedule').filter(v => v);
            const selectedExperience = formData.getAll('experience').filter(v => v);
            const selectedEducation = formData.getAll('education').filter(v => v);

            filteredJobs = allJobs.filter(job => {
                if (selectedMunicipalities.length > 0 && !selectedMunicipalities.includes(job.municipality)) return false;
                if (selectedCategories.length > 0 && !selectedCategories.includes(job.category)) return false;
                if (selectedEmploymentTypes.length > 0 && !selectedEmploymentTypes.includes(job.employmentType)) return false;
                if (selectedWorkSchedules.length > 0 && !selectedWorkSchedules.includes(job.workSchedule)) return false;
                if (selectedExperience.length > 0) {
                    // Would need to parse job experience
                }
                if (selectedEducation.length > 0) {
                    // Would need to parse job education
                }
                return true;
            });

            renderJobs();
        }

        function resetFilters() {
            document.getElementById('jobFilterForm').reset();
            filteredJobs = [...allJobs];
            renderJobs();
        }

        function saveJob(jobId) {
            showToast('Job saved!', 'success');
        }

        function applyJob(jobId) {
            showToast('Application submitted!', 'success');
        }

        // Search functionality
        document.addEventListener('DOMContentLoaded', function() {
            renderJobs();

            // Filter form
            document.getElementById('jobFilterForm').addEventListener('submit', function(e) {
                e.preventDefault();
                applyFilters();
                // Close mobile filter sidebar
                const sidebar = document.getElementById('filterSidebar');
                if (sidebar && window.innerWidth <= 1024) {
                    sidebar.classList.remove('active');
                }
            });

            document.getElementById('resetFilters').addEventListener('click', resetFilters);

            // Search input
            document.getElementById('jobSearchInput').addEventListener('input', function(e) {
                const query = e.target.value.toLowerCase();
                if (query.trim() === '') {
                    filteredJobs = [...allJobs];
                } else {
                    filteredJobs = allJobs.filter(job =>
                        job.title.toLowerCase().includes(query) ||
                        job.company.toLowerCase().includes(query) ||
                        job.tags.some(tag => tag.toLowerCase().includes(query))
                    );
                }
                renderJobs();
            });

            // Sort select
            document.getElementById('sortSelect').addEventListener('change', function(e) {
                const sort = e.target.value;
                switch (sort) {
                    case 'match':
                        filteredJobs.sort((a, b) => b.match - a.match);
                        break;
                    case 'newest':
                        // Would need actual dates
                        break;
                    case 'salary-high':
                        filteredJobs.sort((a, b) => parseSalary(b.salary) - parseSalary(a.salary));
                        break;
                    case 'salary-low':
                        filteredJobs.sort((a, b) => parseSalary(a.salary) - parseSalary(b.salary));
                        break;
                }
                renderJobs();
            });

            // Toggle view
            document.getElementById('toggleView').addEventListener('click', function() {
                currentView = currentView === 'list' ? 'grid' : 'list';
                this.innerHTML = currentView === 'list' ? '<i class="fas fa-th-large"></i>' : '<i class="fas fa-th-list"></i>';
                renderJobs();
            });

            // Mobile filter toggle
            document.getElementById('mobileFilterToggle').addEventListener('click', function() {
                document.getElementById('filterSidebar').classList.toggle('active');
            });
        });

        function parseSalary(salaryStr) {
            const nums = salaryStr.match(/[\d,]+/g);
            if (!nums) return 0;
            return Math.max(...nums.map(n => parseInt(n.replace(/,/g, ''))));
        }

        // Ensure user type is stored for proper sidebar detection
        localStorage.setItem('userType', 'JOB_SEEKER');
    </script>
    <script src="../assets/js/layout.js"></script>
</body>
</html>
