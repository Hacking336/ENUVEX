<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Applications - Job & Skills Matching System</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <div class="sidebar-logo-icon">
                        <i class="fas fa-user-tie"></i>
                    </div>
                    <span>Job Seeker</span>
                </div>
            </div>

            <nav class="sidebar-nav" id="sidebarNav">
                <!-- Injected by layout.js -->
            </nav>

            <div class="sidebar-footer">
                <div class="sidebar-user" onclick="window.location.href='profile.html'">
                    <div class="sidebar-user-avatar">MS</div>
                    <div class="sidebar-user-info">
                        <div class="sidebar-user-name">Maria Santos</div>
                        <div class="sidebar-user-role">Job Seeker</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Sidebar Overlay -->
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- Main Content -->
        <div class="main-content">
            <!-- Top Header -->
            <header class="top-header">
                <div class="top-header-content">
                    <div class="top-header-left">
                        <button class="mobile-menu-btn" id="mobileMenuBtn">
                            <i class="fas fa-bars"></i>
                        </button>
                        <h1 class="top-header-title">My Applications</h1>
                    </div>
                    <div class="top-header-right">
                        <button class="header-btn" id="notificationBtn">
                            <i class="fas fa-bell"></i>
                            <span class="badge">3</span>
                        </button>
                        <button class="header-btn" id="userMenuBtn">
                            <i class="fas fa-user-circle"></i>
                        </button>
                    </div>
                </div>
            </header>

            <!-- Page Content -->
            <main class="page-content">
                <!-- Page Nav -->
                <nav class="page-nav">
                    <a href="dashboard.html"><i class="fas fa-home"></i> Home</a>
                    <span style="color: var(--gray-300);">/</span>
                    <span class="current">Applications</span>
                </nav>

                <!-- Tabs -->
                <div class="tab-nav" id="applicationTabs">
                    <button class="tab-btn active" data-tab="all">All <span class="badge" style="background: var(--gray-200); color: var(--gray-600); font-size: 0.7rem; margin-left: 0.35rem;">12</span></button>
                    <button class="tab-btn" data-tab="applied">Applied <span class="badge" style="background: var(--gray-200); color: var(--gray-600); font-size: 0.7rem; margin-left: 0.35rem;">4</span></button>
                    <button class="tab-btn" data-tab="under-review">Under Review <span class="badge" style="background: rgba(67,97,238,0.1); color: var(--primary-color); font-size: 0.7rem; margin-left: 0.35rem;">3</span></button>
                    <button class="tab-btn" data-tab="shortlisted">Shortlisted <span class="badge" style="background: rgba(248,150,30,0.1); color: var(--warning-color); font-size: 0.7rem; margin-left: 0.35rem;">2</span></button>
                    <button class="tab-btn" data-tab="interview">Interview <span class="badge" style="background: rgba(126,87,194,0.1); color: #7e57c2; font-size: 0.7rem; margin-left: 0.35rem;">1</span></button>
                    <button class="tab-btn" data-tab="accepted">Accepted <span class="badge" style="background: rgba(42,157,143,0.1); color: #2a9d8f; font-size: 0.7rem; margin-left: 0.35rem;">1</span></button>
                    <button class="tab-btn" data-tab="rejected">Rejected <span class="badge" style="background: rgba(249,65,68,0.1); color: var(--danger-color); font-size: 0.7rem; margin-left: 0.35rem;">1</span></button>
                </div>

                <!-- Applications List -->
                <div id="applicationsContainer">
                    <!-- Rendered by JS -->
                </div>
            </main>
        </div>
    </div>

    <!-- Bottom Navigation (Mobile) -->
    <nav class="bottom-nav" id="bottomNav">
        <!-- Injected by layout.js -->
    </nav>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="../assets/js/main.js"></script>
    <script src="../assets/js/layout.js"></script>
    <script>
        // Applications Data
        const applicationsData = [
            {
                id: 1,
                title: 'Restaurant Crew',
                company: "Juan's Eatery",
                salary: '₱12,000 - ₱14,000',
                appliedDate: 'May 15, 2026',
                status: 'under-review',
                match: 88,
                icon: 'fa-utensils',
                iconClass: 'alt'
            },
            {
                id: 2,
                title: 'Pharmacy Assistant',
                company: 'Daet Health Pharmacy',
                salary: '₱10,000 - ₱12,000',
                appliedDate: 'May 12, 2026',
                status: 'shortlisted',
                match: 82,
                icon: 'fa-pills',
                iconClass: 'third'
            },
            {
                id: 3,
                title: 'Driver / Delivery',
                company: 'Daet Logistics',
                salary: '₱9,000 - ₱11,000',
                appliedDate: 'May 10, 2026',
                status: 'interview',
                match: 75,
                icon: 'fa-truck',
                iconClass: ''
            },
            {
                id: 4,
                title: 'Construction Worker',
                company: 'Labo Builders Inc.',
                salary: '₱350/day',
                appliedDate: 'May 8, 2026',
                status: 'under-review',
                match: 72,
                icon: 'fa-hard-hat',
                iconClass: 'alt'
            },
            {
                id: 5,
                title: 'Admin Staff',
                company: 'Vinzons Municipal Office',
                salary: '₱11,000 - ₱13,000',
                appliedDate: 'May 5, 2026',
                status: 'rejected',
                match: 70,
                icon: 'fa-file-alt',
                iconClass: 'third'
            },
            {
                id: 6,
                title: 'Sales Associate',
                company: 'Basud Retail Store',
                salary: '₱8,500 - ₱10,000',
                appliedDate: 'May 3, 2026',
                status: 'applied',
                match: 78,
                icon: 'fa-shopping-cart',
                iconClass: 'fourth'
            },
            {
                id: 7,
                title: 'Farm Worker',
                company: 'Basud Agri-Farm',
                salary: '₱300/day',
                appliedDate: 'May 1, 2026',
                status: 'applied',
                match: 68,
                icon: 'fa-tractor',
                iconClass: 'fourth'
            },
            {
                id: 8,
                title: 'Cashier',
                company: '7-Eleven Daet',
                salary: '₱8,500 - ₱9,500',
                appliedDate: 'Apr 28, 2026',
                status: 'applied',
                match: 65,
                icon: 'fa-cash-register',
                iconClass: ''
            },
            {
                id: 9,
                title: 'Kitchen Helper',
                company: 'Vinzons Restaurant',
                salary: '₱8,000 - ₱9,500',
                appliedDate: 'Apr 25, 2026',
                status: 'under-review',
                match: 62,
                icon: 'fa-utensils',
                iconClass: 'alt'
            },
            {
                id: 10,
                title: 'Security Guard',
                company: 'Daet Security Services',
                salary: '₱10,000 - ₱12,000',
                appliedDate: 'Apr 20, 2026',
                status: 'shortlisted',
                match: 60,
                icon: 'fa-shield-alt',
                iconClass: 'third'
            },
            {
                id: 11,
                title: 'Teacher / Tutor',
                company: 'Vinzons Learning Center',
                salary: '₱200/hour',
                appliedDate: 'Apr 15, 2026',
                status: 'accepted',
                match: 58,
                icon: 'fa-chalkboard-teacher',
                iconClass: 'fourth'
            },
            {
                id: 12,
                title: 'Warehouse Assistant',
                company: 'Basud Agricultural Supply',
                salary: '₱9,500 - ₱11,500',
                appliedDate: 'Apr 10, 2026',
                status: 'applied',
                match: 55,
                icon: 'fa-boxes',
                iconClass: ''
            }
        ];

        let currentTab = 'all';

        function getStatusClass(status) {
            const classes = {
                'applied': 'status-applied',
                'under-review': 'status-under-review',
                'shortlisted': 'status-shortlisted',
                'interview': 'status-interview',
                'accepted': 'status-accepted',
                'rejected': 'status-rejected'
            };
            return classes[status] || 'status-applied';
        }

        function getStatusLabel(status) {
            const labels = {
                'applied': 'Applied',
                'under-review': 'Under Review',
                'shortlisted': 'Shortlisted',
                'interview': 'Interview',
                'accepted': 'Accepted',
                'rejected': 'Rejected'
            };
            return labels[status] || status;
        }

        function filterApplications(tab) {
            if (tab === 'all') return applicationsData;
            return applicationsData.filter(app => app.status === tab);
        }

        function renderApplications(apps) {
            const container = document.getElementById('applicationsContainer');
            if (!container) return;

            if (apps.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon"><i class="fas fa-file-alt"></i></div>
                        <h4>No applications found</h4>
                        <p>Start applying to jobs to see them here</p>
                        <a href="jobs.html" class="btn btn-primary mt-3"><i class="fas fa-search"></i> Browse Jobs</a>
                    </div>
                `;
                return;
            }

            container.innerHTML = apps.map(app => `
                <div class="card fade-in">
                    <div class="card-body">
                        <div style="display: flex; gap: 1rem;">
                            <div class="job-card-icon ${app.iconClass || ''}" style="width: 56px; height: 56px;">
                                <i class="fas ${app.icon}"></i>
                            </div>
                            <div style="flex: 1; min-width: 0;">
                                <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 0.5rem;">
                                    <div>
                                        <h4 style="font-size: 1rem; font-weight: 600; margin-bottom: 0.25rem;">${app.title}</h4>
                                        <p style="font-size: 0.85rem; color: var(--gray-500); margin: 0;">${app.company}</p>
                                    </div>
                                    <span class="status-badge ${getStatusClass(app.status)}">${getStatusLabel(app.status)}</span>
                                </div>
                                <div style="display: flex; flex-wrap: wrap; gap: 1rem; font-size: 0.85rem; color: var(--gray-600); margin-bottom: 0.5rem;">
                                    <span><i class="fas fa-tag"></i> ${app.salary}</span>
                                    <span><i class="fas fa-calendar-alt"></i> Applied: ${app.appliedDate}</span>
                                </div>
                                <div style="display: flex; justify-content: space-between; align-items: center;">
                                    <div style="display: flex; gap: 0.5rem;">
                                        <button class="btn btn-outline btn-sm" onclick="window.location.href='job-details.html?id=${app.id}'"><i class="fas fa-eye"></i> View Job</button>
                                    </div>
                                    <div class="match-percentage" style="margin-top: 0;">
                                        <div class="match-circle ${app.match >= 80 ? 'high' : app.match >= 60 ? 'medium' : 'low'}" style="width: 40px; height: 40px; font-size: 0.85rem;">${app.match}%</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // Tab switching
        document.addEventListener('DOMContentLoaded', function() {
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    tabs.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    currentTab = this.dataset.tab;
                    const filtered = filterApplications(currentTab);
                    renderApplications(filtered);
                });
            });

            // Initial render
            renderApplications(applicationsData);
        });
    </script>
</body>
</html>
