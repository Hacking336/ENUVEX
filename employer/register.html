<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employer Registration - Job & Skills Matching System</title>
    <link rel="stylesheet" href="../assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-page">
    <div class="login-card" style="max-width: 600px;">
        <div class="login-logo">
            <div class="login-logo-icon">
                <i class="fas fa-building"></i>
            </div>
            <h2>Employer Registration</h2>
            <p>Create your business profile to hire local talent</p>
        </div>

        <form class="validate" id="employerRegisterForm" enctype="multipart/form-data">
            <div class="row g-3">
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="businessName" class="form-label">Business Name <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="businessName" placeholder="Enter your business name" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="employerName" class="form-label">Your Name (Owner/HR) <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="employerName" placeholder="Enter your full name" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="email" class="form-label">Email Address <span class="text-danger">*</span></label>
                        <input type="email" class="form-control" id="email" placeholder="Enter business email" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="password" class="form-label">Password <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="password" placeholder="Create a password" required>
                            <button type="button" class="btn btn-outline-secondary password-toggle">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="confirmPassword" class="form-label">Confirm Password <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm your password" required>
                            <button type="button" class="btn btn-outline-secondary password-toggle">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="contactNumber" class="form-label">Contact Number <span class="text-danger">*</span></label>
                        <input type="tel" class="form-control" id="contactNumber" placeholder="+63 9XX XXX XXXX" required>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="businessType" class="form-label">Business Type <span class="text-danger">*</span></label>
                        <select class="form-control form-control-select" id="businessType" required>
                            <option value="">Select Business Type</option>
                            <option value="Retail/Store">Retail/Store</option>
                            <option value="Restaurant/Food Service">Restaurant/Food Service</option>
                            <option value="Hospitality/Tourism">Hospitality/Tourism</option>
                            <option value="Agriculture/Farming">Agriculture/Farming</option>
                            <option value="Fisheries/Aquaculture">Fisheries/Aquaculture</option>
                            <option value="Construction/Engineering">Construction/Engineering</option>
                            <option value="Healthcare/Medical">Healthcare/Medical</option>
                            <option value="Education/Training">Education/Training</option>
                            <option value="Office/Administrative">Office/Administrative</option>
                            <option value="Sales/Marketing">Sales/Marketing</option>
                            <option value="Logistics/Transportation">Logistics/Transportation</option>
                            <option value="Manufacturing/Production">Manufacturing/Production</option>
                            <option value="Automotive/Repair">Automotive/Repair</option>
                            <option value="Security/Services">Security/Services</option>
                            <option value="IT/Technology">IT/Technology</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="municipality" class="form-label">Municipality <span class="text-danger">*</span></label>
                        <select class="form-control form-control-select" id="municipality" required>
                            <option value="">Select Municipality</option>
                            <option value="Basud">Basud</option>
                            <option value="Daet">Daet</option>
                            <option value="Vinzons">Vinzons</option>
                            <option value="Labo">Labo</option>
                        </select>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="form-group">
                        <label for="barangay" class="form-label">Barangay <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="barangay" placeholder="Enter your barangay" required>
                    </div>
                </div>
                <div class="col-12">
                    <div class="form-group">
                        <label for="businessAddress" class="form-label">Business Address <span class="text-danger">*</span></label>
                        <input type="text" class="form-control" id="businessAddress" placeholder="Complete business address" required>
                    </div>
                </div>
                <div class="col-12">
                    <div class="form-group">
                        <label for="businessDescription" class="form-label">Business Description <span class="text-danger">*</span></label>
                        <textarea class="form-control" id="businessDescription" rows="4" placeholder="Describe your business, mission, and work culture" required></textarea>
                    </div>
                </div>
                <div class="col-12">
                    <div class="form-group">
                        <label for="logo" class="form-label">Business Logo</label>
                        <input type="file" class="form-control" id="logo" accept="image/*">
                        <small class="text-muted">Optional: Upload your business logo (recommended size: 200x200px, max 5MB)</small>
                    </div>
                </div>
            </div>

            <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn btn-primary btn-lg">Create Employer Account</button>
            </div>
        </form>

        <div class="mt-4 text-center">
            <a href="../register.html" class="text-decoration-none small">
                <i class="fas fa-arrow-left me-1"></i> Back to Account Type Selection
            </a>
        </div>

        <div class="mt-4 text-center">
            <p class="text-muted">© 2026 Job & Skills Matching System. All rights reserved.</p>
        </div>
    </div>

    <script src="../assets/js/main.js"></script>
    <script>
        // Password confirmation validation
        document.getElementById('confirmPassword').addEventListener('input', function() {
            const password = document.getElementById('password').value;
            const confirmPassword = this.value;
            if (password !== confirmPassword) {
                this.setCustomValidity('Passwords do not match');
            } else {
                this.setCustomValidity('');
            }
        });

        // Handle form submission
        document.getElementById('employerRegisterForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const formData = new FormData();
            formData.append('businessName', document.getElementById('businessName').value);
            formData.append('employerName', document.getElementById('employerName').value);
            formData.append('email', document.getElementById('email').value);
            formData.append('password', document.getElementById('password').value);
            formData.append('contactNumber', document.getElementById('contactNumber').value);
            formData.append('businessType', document.getElementById('businessType').value);
            formData.append('municipality', document.getElementById('municipality').value);
            formData.append('barangay', document.getElementById('barangay').value);
            formData.append('businessAddress', document.getElementById('businessAddress').value);
            formData.append('businessDescription', document.getElementById('businessDescription').value);

            const logo = document.getElementById('logo').files[0];
            if (logo) {
                formData.append('logo', logo);
            }

            try {
                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || 'Registration failed');
                }

                showToast('Employer account created successfully! Please check your email for verification.', 'success');

                setTimeout(() => {
                    window.location.href = '../../index.html';
                }, 2000);
            } catch (error) {
                showToast(error.message, 'error');
            }
        });
    </script>
</body>
</html>
