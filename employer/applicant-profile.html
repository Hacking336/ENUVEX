<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Applicant Profile — JSM</title>
    <link rel="icon" type="image/svg+xml" href="../assets/brand/jsm-favicon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="../assets/brand/jsm-icon-192.png">
    <link rel="apple-touch-icon" href="../assets/brand/jsm-icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://enuvex.onrender.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../job-seeker/enuvex-app.css">
    <link rel="stylesheet" href="../assets/css/enuvex-role.css">
    <script>
        window.ENUVEX_PAGE = {
            active: 'applicants',
            title: 'Applicant Profile',
            subtitle: 'Everything this candidate submitted'
        };
    </script>
</head>
<body data-role="employer">
<div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="side-overlay" id="sideOverlay"></div>

    <div class="main">
        <header class="topbar" id="topbar"></header>

        <main class="content">
            <div class="page-head">
                <div>
                    <h2 id="pageTitle">Applicant profile</h2>
                    <p id="pageSubtitle">Skills, experience and hiring status.</p>
                </div>
                <div class="page-head-actions">
                    <a class="btn-ghost" href="applicants.html"><i class="fas fa-arrow-left"></i> All applicants</a>
                </div>
            </div>

            <div class="alert" id="pageError" hidden>
                <i class="fas fa-circle-exclamation"></i>
                <span id="pageErrorText">Could not load this applicant.</span>
            </div>

            <div id="profileBody">
                <div class="loading">Loading applicant…</div>
            </div>
        </main>
    </div>
</div>

<nav class="bottom-nav" id="bottomNav" aria-label="Quick navigation"></nav>
<div class="toast-container" id="toastContainer" aria-live="polite"></div>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/role-app.js"></script>
<script>
(function () {
    'use strict';

    var applicationId = null;
    var applicant = null;
    var detail = null;

    function showError(message) {
        var box = document.getElementById('pageError');
        var text = document.getElementById('pageErrorText');
        if (!box || !text) return;
        text.textContent = message;
        box.hidden = false;
    }

    function chips(value) {
        var items = String(value || '').split(',').map(function (item) { return item.trim(); }).filter(Boolean);
        if (!items.length) return '<p class="muted">Not provided.</p>';
        return '<div class="tag-list">' + items.map(function (item) {
            return '<span class="chip">' + ROLE.esc(item) + '</span>';
        }).join('') + '</div>';
    }

    function block(title, body) {
        return `<section class="card panel" style="margin-bottom: 18px;">
            <div class="panel-head"><h3><i class="fas fa-circle-dot"></i> ${ROLE.esc(title)}</h3></div>
            ${body}
        </section>`;
    }

    function actions() {
        var status = String(applicant.applicationStatus || 'SUBMITTED').toUpperCase();
        var map = [
            { status: 'REVIEWING', label: 'Start review', cls: 'btn-soft', icon: 'fa-magnifying-glass', when: ['SUBMITTED'] },
            { status: 'SUBMITTED', label: 'Back to submitted', cls: 'btn-ghost', icon: 'fa-rotate-left', when: ['REVIEWING'] },
            { status: 'REVIEWING', label: 'Back to review', cls: 'btn-ghost', icon: 'fa-rotate-left', when: ['SHORTLISTED'] },
            { status: 'SHORTLISTED', label: 'Shortlist', cls: 'btn-ghost', icon: 'fa-star', when: ['SUBMITTED', 'REVIEWING', 'ACCEPTED', 'REJECTED'] },
            { status: 'ACCEPTED', label: 'Hire', cls: 'btn-solid', icon: 'fa-circle-check', when: ['SHORTLISTED', 'INTERVIEW'] },
            { status: 'REJECTED', label: 'Reject', cls: 'btn-danger', icon: 'fa-xmark', when: ['SUBMITTED', 'REVIEWING', 'SHORTLISTED', 'INTERVIEW'] }
        ];
        var buttons = map.filter(function (action) {
            return action.when.indexOf(status) !== -1;
        }).map(function (action) {
            return `<button class="${action.cls} btn-sm" type="button" data-next="${action.status}">
                <i class="fas ${action.icon}"></i> ${action.label}</button>`;
        }).join('');
        if (status !== 'WITHDRAWN' && status !== 'ACCEPTED' && status !== 'REJECTED') {
            buttons += `<a class="btn-soft btn-sm" href="applicants.html?applicationId=${encodeURIComponent(applicationId)}&mode=interview">
                <i class="fas fa-calendar-plus"></i> ${detail && detail.interview ? 'Reschedule interview' : 'Schedule interview'}</a>`;
        }
        return buttons;
    }

    function timelineBlock() {
        if (!detail || !detail.timeline || !detail.timeline.length) {
            return '<p class="muted">No recorded history for this application yet.</p>';
        }
        return '<ul class="timeline">' + detail.timeline.map(function (event) {
            var when = event.createdAt
                ? new Date(event.createdAt).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' }) +
                    ' — ' + new Date(event.createdAt).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })
                : 'Time not recorded';
            return `<li>
                <span class="timeline-dot${event.recorded === false ? ' is-current' : ''}"><i class="fas fa-circle-check"></i></span>
                <div class="timeline-title">${ROLE.esc(event.title || 'Application update')}</div>
                <div class="timeline-time">${ROLE.esc(when)}</div>
                ${event.description ? `<div class="timeline-desc">${ROLE.esc(event.description)}</div>` : ''}
                ${event.actorName ? `<div class="timeline-actor"><i class="fas fa-user"></i>${ROLE.esc(event.actorName)} · ${ROLE.esc(event.actorRole || '')}</div>` : ''}
                ${event.message ? `<div class="timeline-note">${ROLE.esc(event.message)}</div>` : ''}
            </li>`;
        }).join('') + '</ul>';
    }

    function interviewBlock() {
        var interview = detail && detail.interview;
        if (!interview || interview.status === 'CANCELLED') return '';
        var when = new Date(interview.interviewAt);
        return `<section class="interview-box">
            <h3><i class="fas fa-calendar-check"></i> Interview scheduled</h3>
            <div class="kv-grid">
                <div class="kv"><span>Date and time</span><strong>${ROLE.esc(when.toLocaleDateString(undefined, { month: 'long', day: 'numeric', year: 'numeric' }) + ' at ' + when.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }))}</strong></div>
                <div class="kv"><span>Type</span><strong>${ROLE.esc(String(interview.interviewType || '').replace('_', ' ').toLowerCase())}</strong></div>
                <div class="kv"><span>Location</span><strong>${ROLE.esc(interview.location || '—')}</strong></div>
                ${interview.meetingLink ? `<div class="kv"><span>Meeting link</span><strong>${ROLE.esc(interview.meetingLink)}</strong></div>` : ''}
            </div>
            ${interview.instructions ? `<p class="prose" style="margin-top: 10px;">${ROLE.esc(interview.instructions)}</p>` : ''}
        </section>`;
    }

    function render() {
        var name = applicant.fullName || 'Applicant';
        var status = ROLE.statusMeta(applicant.applicationStatus);
        var match = Number(applicant.matchPercentage);

        document.getElementById('pageTitle').textContent = name;
        document.getElementById('pageSubtitle').textContent =
            'Applied for ' + (applicant.jobTitle || 'your job post') + ' on ' + ROLE.dateLabel(applicant.appliedAt);

        var identity = `<div class="card panel" style="margin-bottom: 18px;">
            <div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap;">
                <span class="avatar avatar-lg">${applicant.profilePhoto
                    ? '<img src="' + ROLE.esc(ROLE.photoUrl(applicant.profilePhoto)) + '" alt="">'
                    : ROLE.esc(ROLE.initials(name))}</span>
                <div style="flex: 1 1 220px; min-width: 0;">
                    <h3 style="margin: 0; font-family: var(--font-head); font-size: 18px; color: var(--ink);">${ROLE.esc(name)}</h3>
                    <p class="muted" style="margin-top: 4px;">${ROLE.esc(applicant.jobTitle || 'Applicant')} · ${ROLE.esc(ROLE.municipalityLabel(applicant.location) || 'Location not set')}${applicant.barangay ? ', ' + ROLE.esc(applicant.barangay) : ''}</p>
                    <div class="tag-list" style="margin-top: 10px;">
                        <span class="status ${status.cls}">${ROLE.esc(status.label)}</span>
                        ${isFinite(match) ? '<span class="chip">' + Math.round(match) + '% match</span>' : ''}
                        ${applicant.availability ? '<span class="chip">' + ROLE.esc(String(applicant.availability).replace(/_/g, ' ').toLowerCase()) + '</span>' : ''}
                    </div>
                </div>
                <div class="row-actions">${actions()}</div>
            </div>
        </div>`;

        var details = `<div class="kv-grid">
            <div class="kv"><span>Contact number</span><strong>${ROLE.esc(applicant.contactNumber || '—')}</strong></div>
            <div class="kv"><span>Municipality</span><strong>${ROLE.esc(ROLE.municipalityLabel(applicant.location) || '—')}</strong></div>
            <div class="kv"><span>Barangay</span><strong>${ROLE.esc(applicant.barangay || '—')}</strong></div>
            <div class="kv"><span>Availability</span><strong>${ROLE.esc(String(applicant.availability || '—').replace(/_/g, ' ').toLowerCase())}</strong></div>
            <div class="kv"><span>Employment preference</span><strong>${ROLE.esc(ROLE.typeLabel(applicant.employmentPreference) || '—')}</strong></div>
            <div class="kv"><span>Expected salary</span><strong>${ROLE.esc(ROLE.money(applicant.expectedSalary) || '—')}</strong></div>
            <div class="kv"><span>Education</span><strong>${ROLE.esc(applicant.education || '—')}</strong></div>
            <div class="kv"><span>Applied on</span><strong>${ROLE.esc(ROLE.dateLabel(applicant.appliedAt))}</strong></div>
        </div>`;

        document.getElementById('profileBody').innerHTML = identity +
            interviewBlock() +
            block('Contact and preferences', details) +
            block('Skills', chips(applicant.skills)) +
            block('Work experience', applicant.workExperience
                ? '<p class="prose">' + ROLE.esc(applicant.workExperience) + '</p>'
                : '<p class="muted">No work experience was provided.</p>') +
            block('Certifications', chips(applicant.certifications)) +
            block('Application history', timelineBlock());
    }

    async function boot() {
        var params = new URLSearchParams(window.location.search);
        applicationId = params.get('applicationId');

        if (!applicationId) {
            document.getElementById('profileBody').innerHTML = `<div class="empty">
                <i class="fas fa-user-slash"></i>
                <strong>No applicant selected</strong>
                <p>Open an applicant from the applicants list.</p>
                <a class="btn-solid btn-sm" href="applicants.html">All applicants</a>
            </div>`;
            return;
        }

        var data = await ROLE.loadEmployerData();
        if (data.error) showError(data.error);

        applicant = data.applicants.filter(function (item) {
            return String(item.applicationId) === String(applicationId);
        })[0];

        if (applicant) {
            var detailResult = await ROLE.safe(ApiClient.getApplication(applicationId));
            if (!ROLE.failed(detailResult)) detail = detailResult;
        }

        if (!applicant) {
            document.getElementById('profileBody').innerHTML = `<div class="empty">
                <i class="fas fa-user-slash"></i>
                <strong>Applicant not found</strong>
                <p>This application is not part of your job posts, or it was removed.</p>
                <a class="btn-solid btn-sm" href="applicants.html">All applicants</a>
            </div>`;
            return;
        }

        render();

        document.getElementById('profileBody').addEventListener('click', async function (event) {
            var button = event.target.closest('[data-next]');
            if (!button) return;
            var next = button.getAttribute('data-next');
            button.disabled = true;
            try {
                await ApiClient.updateApplicationStatus(applicationId, next);
                ROLE.toast('Applicant moved to ' + ROLE.statusMeta(next).label + '.', 'success');
                applicant.applicationStatus = next;
                var refreshed = await ROLE.safe(ApiClient.getApplication(applicationId));
                if (!ROLE.failed(refreshed)) detail = refreshed;
                render();
            } catch (error) {
                ROLE.toast(error.message || 'Could not update this applicant.', 'error');
                button.disabled = false;
            }
        });
    }

    document.addEventListener('enuvex:ready', boot, { once: true });
})();
</script>
</body>
</html>
