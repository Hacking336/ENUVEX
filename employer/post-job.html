<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post a Job — ENUVEX</title>
    <link rel="icon" type="image/png" href="../assets/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://enuvex.onrender.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../job-seeker/enuvex-app.css">
    <link rel="stylesheet" href="../assets/css/enuvex-role.css">
    <script>
        window.ENUVEX_PAGE = {
            active: 'post-job',
            title: 'Post a Job',
            subtitle: 'Create a complete opening in one pass'
        };
    </script>
</head>
<body data-role="employer">
<div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="side-overlay" id="sideOverlay"></div>

    <div class="main">
        <header class="topbar" id="topbar"></header>

        <main class="content">
            <div class="page-head">
                <div>
                    <h2 id="formTitle">New job post</h2>
                    <p id="formSubtitle">Fields marked with an asterisk are required by the matching system.</p>
                </div>
                <div class="page-head-actions">
                    <a class="btn-ghost" href="jobs.html"><i class="fas fa-arrow-left"></i> Back to job posts</a>
                </div>
            </div>

            <div class="alert" id="pageError" hidden>
                <i class="fas fa-circle-exclamation"></i>
                <span id="pageErrorText">Could not save this job post.</span>
            </div>

            <form id="jobForm" novalidate>
                <section class="card panel" style="margin-bottom: 18px;">
                    <div class="panel-head">
                        <h3><i class="fas fa-circle-info"></i> Basic information</h3>
                    </div>
                    <div class="form-grid">
                        <div class="form-field span-2">
                            <label for="jobTitle">Position title *</label>
                            <input type="text" id="jobTitle" maxlength="120" placeholder="e.g. Restaurant Crew" required>
                        </div>
                        <div class="form-field">
                            <label for="jobCategory">Job category *</label>
                            <select id="jobCategory" required>
                                <option value="">Select a category</option>
                            </select>
                        </div>
                        <div class="form-field">
                            <label for="employmentType">Employment type</label>
                            <select id="employmentType">
                                <option value="">Not specified</option>
                                <option value="FULL_TIME">Full-time</option>
                                <option value="PART_TIME">Part-time</option>
                                <option value="CONTRACT">Contract</option>
                                <option value="TEMPORARY">Temporary</option>
                            </select>
                        </div>
                        <div class="form-field">
                            <label for="workSchedule">Work schedule</label>
                            <select id="workSchedule">
                                <option value="">Not specified</option>
                                <option value="MORNING">Morning</option>
                                <option value="AFTERNOON">Afternoon</option>
                                <option value="EVENING">Evening</option>
                                <option value="NIGHT">Night</option>
                                <option value="WEEKEND">Weekend</option>
                                <option value="FLEXIBLE">Flexible</option>
                            </select>
                        </div>
                        <div class="form-field">
                            <label for="availablePositions">Available positions</label>
                            <input type="number" id="availablePositions" min="1" step="1" value="1">
                        </div>
                    </div>
                </section>

                <section class="card panel" style="margin-bottom: 18px;">
                    <div class="panel-head">
                        <h3><i class="fas fa-file-lines"></i> Role details</h3>
                    </div>
                    <div class="form-grid">
                        <div class="form-field span-2">
                            <label for="jobDescription">Job description *</label>
                            <textarea id="jobDescription" placeholder="What the role is, who it suits, and what the work involves." required></textarea>
                        </div>
                        <div class="form-field span-2">
                            <label for="responsibilities">Key responsibilities *</label>
                            <textarea id="responsibilities" placeholder="One responsibility per line." required></textarea>
                        </div>
                        <div class="form-field span-2">
                            <label for="requiredSkills">Required skills</label>
                            <input type="text" id="requiredSkills" placeholder="Comma separated, e.g. Customer Service, Cashier, Inventory">
                            <p class="form-note">These skills drive the match percentage shown to applicants.</p>
                        </div>
                    </div>
                </section>

                <section class="card panel" style="margin-bottom: 18px;">
                    <div class="panel-head">
                        <h3><i class="fas fa-location-dot"></i> Workplace</h3>
                    </div>
                    <div class="form-grid">
                        <div class="form-field">
                            <label for="municipality">Municipality *</label>
                            <select id="municipality" required>
                                <option value="">Select a municipality</option>
                            </select>
                        </div>
                        <div class="form-field">
                            <label for="barangay">Barangay</label>
                            <input type="text" id="barangay" placeholder="e.g. Bagasbas">
                        </div>
                        <div class="form-field span-2">
                            <label for="jobLocation">Exact address or landmark</label>
                            <input type="text" id="jobLocation" placeholder="e.g. 123 Main Street, near the public market">
                        </div>
                    </div>
                </section>

                <section class="card panel" style="margin-bottom: 18px;">
                    <div class="panel-head">
                        <h3><i class="fas fa-coins"></i> Compensation and requirements</h3>
                    </div>
                    <div class="form-grid">
                        <div class="form-field">
                            <label for="salaryMin">Minimum salary (₱)</label>
                            <input type="number" id="salaryMin" min="0" step="1" placeholder="e.g. 12000">
                        </div>
                        <div class="form-field">
                            <label for="salaryMax">Maximum salary (₱)</label>
                            <input type="number" id="salaryMax" min="0" step="1" placeholder="e.g. 15000">
                        </div>
                        <div class="form-field">
                            <label for="educationRequirement">Education requirement</label>
                            <select id="educationRequirement">
                                <option value="">Any</option>
                                <option value="ELEMENTARY_GRADUATE">Elementary graduate</option>
                                <option value="HIGH_SCHOOL_GRADUATE">High school graduate</option>
                                <option value="VOCATIONAL_TECHNICAL">Vocational / technical</option>
                                <option value="COLLEGE_GRADUATE">College graduate</option>
                                <option value="POST_GRADUATE">Post graduate</option>
                            </select>
                        </div>
                        <div class="form-field">
                            <label for="experienceRequirement">Experience requirement</label>
                            <input type="text" id="experienceRequirement" placeholder="e.g. 1-2 years, or none">
                        </div>
                        <div class="form-field span-2">
                            <label for="certifications">Preferred certifications</label>
                            <input type="text" id="certifications" placeholder="Comma separated, e.g. Food Safety Training, NC II">
                        </div>
                    </div>
                </section>

                <div class="card panel" style="display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap;">
                    <a class="btn-soft" href="jobs.html">Cancel</a>
                    <button class="btn-solid" type="submit" id="submitBtn"><i class="fas fa-paper-plane"></i> Publish job</button>
                </div>
            </form>
        </main>
    </div>
</div>

<nav class="bottom-nav" id="bottomNav" aria-label="Quick navigation"></nav>
<div class="toast-container" id="toastContainer" aria-live="polite"></div>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/role-app.js"></script>
<script>
(function () {
    'use strict';

    var CATEGORY_OPTIONS = {
        RETAIL_STORE: 'Retail / Store', SALES: 'Sales',
        FOOD_SERVICE_RESTAURANT: 'Food Service / Restaurant',
        HOSPITALITY_TOURISM: 'Hospitality / Tourism',
        OFFICE_ADMINISTRATION: 'Office / Administration',
        ACCOUNTING_FINANCE: 'Accounting / Finance', HEALTHCARE: 'Healthcare',
        EDUCATION_TUTORING: 'Education / Tutoring',
        CONSTRUCTION_SKILLED_TRADES: 'Construction / Skilled Trades',
        AGRICULTURE: 'Agriculture', FISHERIES: 'Fisheries', MANUFACTURING: 'Manufacturing',
        LOGISTICS_DELIVERY: 'Logistics / Delivery', TRANSPORTATION: 'Transportation',
        AUTOMOTIVE_MECHANICAL: 'Automotive / Mechanical', CUSTOMER_SERVICE: 'Customer Service',
        SECURITY: 'Security', GENERAL_LABOR: 'General Labor',
        IT_TECHNOLOGY: 'IT / Technology', OTHER: 'Other'
    };

    var editingId = null;

    function field(id) { return document.getElementById(id); }

    function showError(message) {
        var box = field('pageError');
        var text = field('pageErrorText');
        if (!box || !text) return;
        text.textContent = message;
        box.hidden = false;
    }

    function hideError() {
        var box = field('pageError');
        if (box) box.hidden = true;
    }

    function fillCategories() {
        var select = field('jobCategory');
        Object.keys(CATEGORY_OPTIONS).forEach(function (value) {
            var option = document.createElement('option');
            option.value = value;
            option.textContent = CATEGORY_OPTIONS[value];
            select.appendChild(option);
        });
    }

    async function fillMunicipalities() {
        var select = field('municipality');
        var result = await ROLE.safe(ApiClient.request('/municipalities'));
        var values = ROLE.failed(result) || !Array.isArray(result)
            ? ['BASUD', 'DAET', 'VINZONS', 'LABO']
            : result;
        values.forEach(function (value) {
            var option = document.createElement('option');
            option.value = value;
            option.textContent = ROLE.municipalityLabel(value);
            select.appendChild(option);
        });
    }

    function payload() {
        var data = {
            jobTitle: field('jobTitle').value.trim(),
            jobCategory: field('jobCategory').value || null,
            jobDescription: field('jobDescription').value.trim(),
            responsibilities: field('responsibilities').value.trim(),
            requiredSkills: field('requiredSkills').value.trim() || null,
            barangay: field('barangay').value.trim() || null,
            jobLocation: field('jobLocation').value.trim() || null,
            experienceRequirement: field('experienceRequirement').value.trim() || null,
            certifications: field('certifications').value.trim() || null,
            employmentType: field('employmentType').value || null,
            workSchedule: field('workSchedule').value || null,
            educationRequirement: field('educationRequirement').value || null,
            municipality: field('municipality').value || null,
            availablePositions: Number(field('availablePositions').value || 1),
            isActive: true
        };

        var min = field('salaryMin').value.trim();
        var max = field('salaryMax').value.trim();
        if (min) data.salaryMin = Number(min);
        if (max) data.salaryMax = Number(max);

        return data;
    }

    function validate(data) {
        if (!data.jobTitle) return 'Enter a position title.';
        if (!data.jobCategory) return 'Select a job category.';
        if (!data.jobDescription) return 'Enter a job description.';
        if (!data.responsibilities) return 'Enter the key responsibilities.';
        if (!data.municipality) return 'Select a municipality.';
        if (data.availablePositions < 1) return 'Available positions must be at least 1.';
        return null;
    }

    async function loadForEdit(id) {
        var result = await ROLE.safe(ApiClient.getMyJobs());
        if (ROLE.failed(result) || !Array.isArray(result)) {
            showError(ROLE.failed(result) ? result.__error : 'Could not load this job post.');
            return;
        }
        var job = result.filter(function (item) { return String(item.id) === String(id); })[0];
        if (!job) {
            showError('That job post could not be found on your account.');
            return;
        }

        document.getElementById('formTitle').textContent = 'Edit job post';
        document.getElementById('formSubtitle').textContent = 'Changes are saved to the same post applicants already see.';
        document.getElementById('submitBtn').innerHTML = '<i class="fas fa-floppy-disk"></i> Save changes';

        field('jobTitle').value = job.jobTitle || '';
        field('jobCategory').value = job.jobCategory || '';
        field('employmentType').value = job.employmentType || '';
        field('workSchedule').value = job.workSchedule || '';
        field('availablePositions').value = job.availablePositions || 1;
        field('jobDescription').value = job.jobDescription || '';
        field('responsibilities').value = job.responsibilities || '';
        field('requiredSkills').value = job.requiredSkills || '';
        field('municipality').value = job.municipality || '';
        field('barangay').value = job.barangay || '';
        field('jobLocation').value = job.jobLocation || '';
        field('salaryMin').value = job.salaryMin == null ? '' : job.salaryMin;
        field('salaryMax').value = job.salaryMax == null ? '' : job.salaryMax;
        field('educationRequirement').value = job.educationRequirement || '';
        field('experienceRequirement').value = job.experienceRequirement || '';
        field('certifications').value = job.certifications || '';
    }

    document.addEventListener('enuvex:ready', async function () {
        fillCategories();
        await fillMunicipalities();

        var params = new URLSearchParams(window.location.search);
        var id = params.get('id');
        if (id) {
            editingId = id;
            await loadForEdit(id);
        }

        document.getElementById('jobForm').addEventListener('submit', async function (event) {
            event.preventDefault();
            hideError();

            var data = payload();
            var problem = validate(data);
            if (problem) {
                showError(problem);
                return;
            }

            var submit = field('submitBtn');
            submit.disabled = true;
            try {
                if (editingId) {
                    await ApiClient.updateJob(editingId, data);
                    ROLE.toast('Job post updated.', 'success');
                } else {
                    await ApiClient.postJob(data);
                    ROLE.toast('Job post published.', 'success');
                }
                window.location.href = 'jobs.html';
            } catch (error) {
                showError(error.message || 'Could not save this job post.');
                submit.disabled = false;
            }
        });
    }, { once: true });
})();
</script>
</body>
</html>
