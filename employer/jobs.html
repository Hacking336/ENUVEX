<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>My Job Posts — ENUVEX</title>
    <link rel="icon" type="image/png" href="../assets/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://enuvex.onrender.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../job-seeker/enuvex-app.css">
    <link rel="stylesheet" href="../assets/css/enuvex-role.css">
    <script>
        window.ENUVEX_PAGE = {
            active: 'jobs',
            title: 'My Job Posts',
            subtitle: 'Manage every opening you have published'
        };
    </script>
</head>
<body data-role="employer">
<div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="side-overlay" id="sideOverlay"></div>

    <div class="main">
        <header class="topbar" id="topbar"></header>

        <main class="content">
            <div class="page-head">
                <div>
                    <h2>Job posts</h2>
                    <p>Edit a post, open its applicants, pause it, or remove it.</p>
                </div>
                <div class="page-head-actions">
                    <a class="btn-solid" href="post-job.html"><i class="fas fa-circle-plus"></i> Post a Job</a>
                </div>
            </div>

            <div class="alert" id="pageError" hidden>
                <i class="fas fa-circle-exclamation"></i>
                <span id="pageErrorText">Could not load your job posts.</span>
            </div>

            <div class="card rv-toolbar">
                <label class="field" for="jobSearch">
                    <i class="fas fa-magnifying-glass"></i>
                    <input type="search" id="jobSearch" placeholder="Search by title, skills, or barangay">
                </label>
                <div class="form-field">
                    <label for="statusFilter">Status</label>
                    <select id="statusFilter">
                        <option value="ALL">All statuses</option>
                        <option value="ACTIVE">Active</option>
                        <option value="INACTIVE">Inactive</option>
                    </select>
                </div>
                <span class="rv-spacer"></span>
                <span class="muted" id="resultCount"></span>
            </div>

            <div class="card panel" style="padding: 0;">
                <div class="list-rows" id="jobRows">
                    <div class="loading">Loading your job posts…</div>
                </div>
            </div>
        </main>
    </div>
</div>

<nav class="bottom-nav" id="bottomNav" aria-label="Quick navigation"></nav>
<div class="toast-container" id="toastContainer" aria-live="polite"></div>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/role-app.js"></script>
<script>
(function () {
    'use strict';

    var state = { jobs: [], counts: {}, query: '', status: 'ALL' };

    function showError(message) {
        var box = document.getElementById('pageError');
        var text = document.getElementById('pageErrorText');
        if (!box || !text) return;
        text.textContent = message;
        box.hidden = false;
    }

    function isActive(job) {
        return job.active !== undefined ? !!job.active : !!job.isActive;
    }

    function row(job) {
        var applicants = state.counts[job.id] || 0;
        return `<div class="list-row">
            <span class="list-icon"><i class="fas ${ROLE.categoryIcon(job.jobCategory)}"></i></span>
            <div class="list-body">
                <h4><a href="post-job.html?id=${encodeURIComponent(job.id)}">${ROLE.esc(job.jobTitle)}</a></h4>
                <div class="list-meta">
                    <span><i class="fas fa-tag"></i>${ROLE.esc(ROLE.categoryLabel(job.jobCategory))}</span>
                    <span><i class="fas fa-clock"></i>${ROLE.esc(ROLE.typeLabel(job.employmentType) || 'Type not set')}</span>
                    <span><i class="fas fa-location-dot"></i>${ROLE.esc(ROLE.municipalityLabel(job.municipality))}${job.barangay ? ', ' + ROLE.esc(job.barangay) : ''}</span>
                    <span><i class="fas fa-money-bill-wave"></i>${ROLE.esc(ROLE.salaryLabel(job))}</span>
                    <span><i class="fas fa-users"></i>${applicants} applicant${applicants === 1 ? '' : 's'}</span>
                    <span><i class="fas fa-calendar"></i>Posted ${ROLE.esc(ROLE.dateLabel(job.createdAt))}</span>
                </div>
            </div>
            <div class="list-side">
                <span class="status ${isActive(job) ? 'status-accepted' : 'status-rejected'}">${isActive(job) ? 'Active' : 'Inactive'}</span>
                <a class="btn-soft btn-sm" href="applicants.html?jobId=${encodeURIComponent(job.id)}"><i class="fas fa-users"></i> Applicants</a>
                <a class="btn-ghost btn-sm" href="post-job.html?id=${encodeURIComponent(job.id)}"><i class="fas fa-pen"></i> Edit</a>
                <button class="btn-soft btn-sm" type="button" data-toggle="${encodeURIComponent(job.id)}" data-active="${isActive(job) ? '1' : '0'}">
                    <i class="fas ${isActive(job) ? 'fa-pause' : 'fa-play'}"></i> ${isActive(job) ? 'Pause' : 'Activate'}
                </button>
                <button class="btn-danger btn-sm" type="button" data-delete="${encodeURIComponent(job.id)}"><i class="fas fa-trash"></i></button>
            </div>
        </div>`;
    }

    function matches(job) {
        if (state.status === 'ACTIVE' && !isActive(job)) return false;
        if (state.status === 'INACTIVE' && isActive(job)) return false;
        if (!state.query) return true;
        var haystack = [job.jobTitle, job.jobCategory, job.barangay, job.requiredSkills, job.jobLocation]
            .filter(Boolean).join(' ').toLowerCase();
        return haystack.indexOf(state.query) !== -1;
    }

    function render() {
        var container = document.getElementById('jobRows');
        var visible = state.jobs.filter(matches);
        document.getElementById('resultCount').textContent =
            visible.length + ' of ' + state.jobs.length + ' post' + (state.jobs.length === 1 ? '' : 's');

        if (!state.jobs.length) {
            container.innerHTML = `<div class="empty">
                <i class="fas fa-briefcase"></i>
                <strong>No job posts yet</strong>
                <p>Publish your first opening so job seekers can apply.</p>
                <a class="btn-solid btn-sm" href="post-job.html">Post a job</a>
            </div>`;
            return;
        }

        if (!visible.length) {
            container.innerHTML = `<div class="empty">
                <i class="fas fa-magnifying-glass"></i>
                <strong>No posts match this filter</strong>
                <p>Try a different search term or status.</p>
            </div>`;
            return;
        }

        container.innerHTML = visible.map(row).join('');
    }

    async function load() {
        var data = await ROLE.loadEmployerData();
        if (data.error) showError(data.error);
        state.jobs = data.jobs.slice().sort(function (a, b) {
            return new Date(b.createdAt || 0) - new Date(a.createdAt || 0);
        });
        state.counts = {};
        data.applicants.forEach(function (applicant) {
            state.counts[applicant.jobId] = (state.counts[applicant.jobId] || 0) + 1;
        });
        render();
    }

    function wire() {
        var search = document.getElementById('jobSearch');
        search.addEventListener('input', function () {
            state.query = this.value.trim().toLowerCase();
            render();
        });

        document.getElementById('statusFilter').addEventListener('change', function () {
            state.status = this.value;
            render();
        });

        document.getElementById('jobRows').addEventListener('click', async function (event) {
            var toggle = event.target.closest('[data-toggle]');
            var remove = event.target.closest('[data-delete]');

            if (toggle) {
                var id = decodeURIComponent(toggle.getAttribute('data-toggle'));
                var activate = toggle.getAttribute('data-active') === '0';
                toggle.disabled = true;
                try {
                    // The entity getter is isActive(), so Jackson names the
                    // property "active"; both keys are sent so the pause cannot
                    // be silently ignored.
                    await ApiClient.updateJob(id, { active: activate, isActive: activate });
                    ROLE.toast(activate ? 'Job post activated.' : 'Job post paused.', 'success');
                    await load();
                } catch (error) {
                    ROLE.toast(error.message || 'Could not update this job post.', 'error');
                    toggle.disabled = false;
                }
                return;
            }

            if (remove) {
                var jobId = decodeURIComponent(remove.getAttribute('data-delete'));
                if (!window.confirm('Delete this job post permanently? Applications stay in the database but the post is removed.')) return;
                remove.disabled = true;
                try {
                    await ApiClient.deleteJob(jobId);
                    ROLE.toast('Job post deleted.', 'success');
                    await load();
                } catch (error) {
                    ROLE.toast(error.message || 'Could not delete this job post.', 'error');
                    remove.disabled = false;
                }
            }
        });
    }

    document.addEventListener('enuvex:ready', function () {
        var params = new URLSearchParams(window.location.search);
        var query = params.get('q');
        if (query) {
            document.getElementById('jobSearch').value = query;
            state.query = query.toLowerCase();
        }
        wire();
        load();
    }, { once: true });
})();
</script>
</body>
</html>
