<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Applicants — JSM</title>
    <link rel="icon" type="image/svg+xml" href="../assets/brand/jsm-favicon.svg">
    <link rel="icon" type="image/png" sizes="192x192" href="../assets/brand/jsm-icon-192.png">
    <link rel="apple-touch-icon" href="../assets/brand/jsm-icon-192.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://enuvex.onrender.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../job-seeker/enuvex-app.css">
    <link rel="stylesheet" href="../assets/css/enuvex-role.css">
    <script>
        window.ENUVEX_PAGE = {
            active: 'applicants',
            title: 'Applicants',
            subtitle: 'Review, shortlist, interview and hire'
        };
    </script>
</head>
<body data-role="employer">
<div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="side-overlay" id="sideOverlay"></div>

    <div class="main">
        <header class="topbar" id="topbar"></header>

        <main class="content">
            <div class="page-head">
                <div>
                    <h2>Applicants</h2>
                    <p>Every application to your job posts, with the match score the system calculated.</p>
                </div>
                <div class="page-head-actions">
                    <a class="btn-ghost" href="jobs.html"><i class="fas fa-briefcase"></i> Job posts</a>
                </div>
            </div>

            <div class="alert" id="pageError" hidden>
                <i class="fas fa-circle-exclamation"></i>
                <span id="pageErrorText">Could not load applicants.</span>
            </div>

            <div class="card rv-toolbar">
                <div class="form-field">
                    <label for="jobFilter">Job post</label>
                    <select id="jobFilter"><option value="ALL">All job posts</option></select>
                </div>
                <div class="form-field">
                    <label for="sortFilter">Sort by</label>
                    <select id="sortFilter">
                        <option value="match">Best match</option>
                        <option value="date">Newest application</option>
                        <option value="name">Applicant name</option>
                    </select>
                </div>
                <label class="field" for="applicantSearch">
                    <i class="fas fa-magnifying-glass"></i>
                    <input type="search" id="applicantSearch" placeholder="Search name, skill, or barangay">
                </label>
                <span class="rv-spacer"></span>
                <span class="muted" id="resultCount"></span>
            </div>

            <div class="tabs" id="statusTabs" role="tablist" aria-label="Filter applicants by status">
                <button class="tab is-active" type="button" data-status="ALL" role="tab" aria-selected="true">All <span class="count" id="countAll">0</span></button>
                <button class="tab" type="button" data-status="APPLIED" role="tab" aria-selected="false">Applied <span class="count" id="countApplied">0</span></button>
                <button class="tab" type="button" data-status="UNDER_REVIEW" role="tab" aria-selected="false">Under review <span class="count" id="countReview">0</span></button>
                <button class="tab" type="button" data-status="SHORTLISTED" role="tab" aria-selected="false">Shortlisted <span class="count" id="countShortlisted">0</span></button>
                <button class="tab" type="button" data-status="INTERVIEW" role="tab" aria-selected="false">Interview <span class="count" id="countInterview">0</span></button>
                <button class="tab" type="button" data-status="ACCEPTED" role="tab" aria-selected="false">Hired <span class="count" id="countAccepted">0</span></button>
                <button class="tab" type="button" data-status="REJECTED" role="tab" aria-selected="false">Rejected <span class="count" id="countRejected">0</span></button>
            </div>

            <div class="card panel" style="padding: 0;">
                <div class="list-rows" id="applicantRows">
                    <div class="loading">Loading applicants…</div>
                </div>
            </div>
        </main>
    </div>
</div>

<nav class="bottom-nav" id="bottomNav" aria-label="Quick navigation"></nav>
<div class="toast-container" id="toastContainer" aria-live="polite"></div>

<script src="../assets/js/api.js"></script>
<script src="../assets/js/role-app.js"></script>
<script>
(function () {
    'use strict';

    var state = { jobs: [], applicants: [], status: 'ALL', jobId: 'ALL', sort: 'match', query: '' };

    var ACTIONS = {
        APPLIED: [
            { status: 'UNDER_REVIEW', label: 'Start review', icon: 'fa-magnifying-glass', cls: 'btn-soft' },
            { status: 'SHORTLISTED', label: 'Shortlist', icon: 'fa-star', cls: 'btn-ghost' },
            { status: 'REJECTED', label: 'Reject', icon: 'fa-xmark', cls: 'btn-danger' }
        ],
        UNDER_REVIEW: [
            { status: 'SHORTLISTED', label: 'Shortlist', icon: 'fa-star', cls: 'btn-ghost' },
            { status: 'REJECTED', label: 'Reject', icon: 'fa-xmark', cls: 'btn-danger' }
        ],
        SHORTLISTED: [
            { status: 'INTERVIEW', label: 'Interview', icon: 'fa-calendar-check', cls: 'btn-soft' },
            { status: 'ACCEPTED', label: 'Hire', icon: 'fa-circle-check', cls: 'btn-solid' },
            { status: 'REJECTED', label: 'Reject', icon: 'fa-xmark', cls: 'btn-danger' }
        ],
        INTERVIEW: [
            { status: 'ACCEPTED', label: 'Hire', icon: 'fa-circle-check', cls: 'btn-solid' },
            { status: 'REJECTED', label: 'Reject', icon: 'fa-xmark', cls: 'btn-danger' }
        ],
        ACCEPTED: [
            { status: 'SHORTLISTED', label: 'Reopen', icon: 'fa-rotate-left', cls: 'btn-soft' }
        ],
        REJECTED: [
            { status: 'UNDER_REVIEW', label: 'Reconsider', icon: 'fa-rotate-left', cls: 'btn-soft' }
        ]
    };

    function showError(message) {
        var box = document.getElementById('pageError');
        var text = document.getElementById('pageErrorText');
        if (!box || !text) return;
        text.textContent = message;
        box.hidden = false;
    }

    function actionsFor(applicant) {
        var status = String(applicant.applicationStatus || 'APPLIED').toUpperCase();
        return (ACTIONS[status] || ACTIONS.APPLIED).map(function (action) {
            return `<button class="${action.cls} btn-sm" type="button"
                data-app="${encodeURIComponent(applicant.applicationId)}"
                data-next="${action.status}">
                <i class="fas ${action.icon}"></i> ${action.label}</button>`;
        }).join('');
    }

    function row(applicant) {
        var name = applicant.fullName || 'Applicant';
        var match = Number(applicant.matchPercentage);
        var matchCls = !isFinite(match) ? 'low' : match >= 75 ? '' : match >= 55 ? 'mid' : 'low';
        var status = ROLE.statusMeta(applicant.applicationStatus);
        var skills = String(applicant.skills || '').split(',').map(function (skill) {
            return skill.trim();
        }).filter(Boolean);

        return `<div class="list-row">
            <span class="avatar">${ROLE.esc(ROLE.initials(name))}</span>
            <div class="list-body">
                <h4><a href="applicant-profile.html?applicationId=${encodeURIComponent(applicant.applicationId || '')}">${ROLE.esc(name)}</a></h4>
                <div class="list-meta">
                    <span><i class="fas fa-briefcase"></i>${ROLE.esc(applicant.jobTitle || '—')}</span>
                    <span><i class="fas fa-location-dot"></i>${ROLE.esc(ROLE.municipalityLabel(applicant.location) || 'Not set')}${applicant.barangay ? ', ' + ROLE.esc(applicant.barangay) : ''}</span>
                    <span><i class="fas fa-calendar"></i>Applied ${ROLE.esc(ROLE.dateLabel(applicant.appliedAt))}</span>
                    ${skills.length ? `<span><i class="fas fa-tags"></i>${ROLE.esc(skills.slice(0, 3).join(', '))}</span>` : ''}
                </div>
            </div>
            <div class="list-side">
                ${isFinite(match) ? `<span class="match-pill ${matchCls}">${Math.round(match)}%</span>` : ''}
                <span class="status ${status.cls}">${ROLE.esc(status.label)}</span>
                ${actionsFor(applicant)}
                <a class="btn-soft btn-sm" href="applicant-profile.html?applicationId=${encodeURIComponent(applicant.applicationId || '')}">View profile</a>
            </div>
        </div>`;
    }

    function visible() {
        var list = state.applicants.filter(function (applicant) {
            if (state.status !== 'ALL' && String(applicant.applicationStatus || '').toUpperCase() !== state.status) return false;
            if (state.jobId !== 'ALL' && String(applicant.jobId) !== String(state.jobId)) return false;
            if (!state.query) return true;
            var haystack = [applicant.fullName, applicant.skills, applicant.barangay, applicant.jobTitle]
                .filter(Boolean).join(' ').toLowerCase();
            return haystack.indexOf(state.query) !== -1;
        });

        return list.sort(function (a, b) {
            if (state.sort === 'name') return String(a.fullName || '').localeCompare(String(b.fullName || ''));
            if (state.sort === 'date') return new Date(b.appliedAt || 0) - new Date(a.appliedAt || 0);
            return (Number(b.matchPercentage) || 0) - (Number(a.matchPercentage) || 0);
        });
    }

    function render() {
        var counts = { ALL: state.applicants.length };
        state.applicants.forEach(function (applicant) {
            var status = String(applicant.applicationStatus || 'APPLIED').toUpperCase();
            counts[status] = (counts[status] || 0) + 1;
        });
        document.getElementById('countAll').textContent = counts.ALL;
        document.getElementById('countApplied').textContent = counts.APPLIED || 0;
        document.getElementById('countReview').textContent = counts.UNDER_REVIEW || 0;
        document.getElementById('countShortlisted').textContent = counts.SHORTLISTED || 0;
        document.getElementById('countInterview').textContent = counts.INTERVIEW || 0;
        document.getElementById('countAccepted').textContent = counts.ACCEPTED || 0;
        document.getElementById('countRejected').textContent = counts.REJECTED || 0;

        var list = visible();
        document.getElementById('resultCount').textContent =
            list.length + ' of ' + state.applicants.length + ' application' + (state.applicants.length === 1 ? '' : 's');

        var container = document.getElementById('applicantRows');
        if (!state.applicants.length) {
            container.innerHTML = `<div class="empty">
                <i class="fas fa-user-check"></i>
                <strong>No applicants yet</strong>
                <p>Applications to your job posts will appear here with their match score.</p>
                <a class="btn-solid btn-sm" href="jobs.html">Review your job posts</a>
            </div>`;
            return;
        }
        if (!list.length) {
            container.innerHTML = `<div class="empty">
                <i class="fas fa-filter"></i>
                <strong>No applicants match this filter</strong>
                <p>Try another status, job post, or search term.</p>
            </div>`;
            return;
        }
        container.innerHTML = list.map(row).join('');
    }

    async function load() {
        var data = await ROLE.loadEmployerData();
        if (data.error) showError(data.error);
        state.jobs = data.jobs;
        state.applicants = data.applicants;
        render();
    }

    function fillJobFilter() {
        var select = document.getElementById('jobFilter');
        state.jobs.forEach(function (job) {
            var option = document.createElement('option');
            option.value = job.id;
            option.textContent = job.jobTitle;
            select.appendChild(option);
        });
        if (state.jobId !== 'ALL') select.value = state.jobId;
    }

    document.addEventListener('enuvex:ready', async function () {
        var params = new URLSearchParams(window.location.search);
        if (params.get('jobId')) state.jobId = params.get('jobId');

        document.getElementById('jobFilter').addEventListener('change', function () {
            state.jobId = this.value;
            render();
        });
        document.getElementById('sortFilter').addEventListener('change', function () {
            state.sort = this.value;
            render();
        });
        document.getElementById('applicantSearch').addEventListener('input', function () {
            state.query = this.value.trim().toLowerCase();
            render();
        });

        var tabs = document.querySelectorAll('#statusTabs .tab');
        tabs.forEach(function (tab) {
            tab.addEventListener('click', function () {
                tabs.forEach(function (other) {
                    other.classList.remove('is-active');
                    other.setAttribute('aria-selected', 'false');
                });
                this.classList.add('is-active');
                this.setAttribute('aria-selected', 'true');
                state.status = this.getAttribute('data-status');
                render();
            });
        });

        document.getElementById('applicantRows').addEventListener('click', async function (event) {
            var button = event.target.closest('[data-app]');
            if (!button) return;
            var applicationId = decodeURIComponent(button.getAttribute('data-app'));
            var next = button.getAttribute('data-next');
            button.disabled = true;
            try {
                await ApiClient.updateApplicationStatus(applicationId, next);
                ROLE.toast('Applicant moved to ' + ROLE.statusMeta(next).label + '.', 'success');
                await load();
            } catch (error) {
                ROLE.toast(error.message || 'Could not update this applicant.', 'error');
                button.disabled = false;
            }
        });

        await load();
        fillJobFilter();
        render();
    }, { once: true });
})();
</script>
</body>
</html>
