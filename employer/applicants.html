                    <button class="tab-btn" data-tab="rejected">Rejected <span class="badge" style="background: rgba(249,65,68,0.1); color: var(--danger-color); font-size: 0.7rem; margin-left: 0.35rem;">5</span></button>
                </div>

                <!-- Applicants List -->

        let currentTab = 'all';
        let currentSort = 'match';

        function getStatusClass(status) {
            const classes = {
                'applied': 'status-applied',
                'under-review': 'status-under-review',
                'shortlisted': 'status-shortlisted',
                'interview': 'status-interview',
                'accepted': 'status-accepted',
                'rejected': 'status-rejected'
            };
            return classes[status] || 'status-applied';
        }

        function getStatusLabel(status) {
            const labels = {
                'applied': 'Applied',
                'under-review': 'Under Review',
                'shortlisted': 'Shortlisted',
                'interview': 'Interview',
                'accepted': 'Accepted',
                'rejected': 'Rejected'
            };
            return labels[status] || status;
        }

        function filterApplicants(tab) {
            if (tab === 'all') return applicantsData;
            return applicantsData.filter(app => app.status === tab);
        }

        function sortApplicants(apps, sortBy) {
            const sorted = [...apps];
            switch (sortBy) {
                case 'match':
                    return sorted.sort((a, b) => b.match - a.match);
                case 'date':
                    // Would need actual dates
                    return sorted;
                case 'experience':
                    return sorted.sort((a, b) => {
                        const expA = parseExperience(a.experience);
                        const expB = parseExperience(b.experience);
                        return expB - expA;
                    });
                case 'distance':
                    return sorted.sort((a, b) => parseDistance(a.distance) - parseDistance(b.distance));
                default:
                    return sorted;
            }
        }

        function parseExperience(exp) {
            const match = exp.match(/(\d+)/);
            return match ? parseInt(match[1]) : 0;
        }

        function parseDistance(dist) {
            const match = dist.match(/([\d.]+)/);
            return match ? parseFloat(match[1]) : 999;
        }

        function renderApplicants() {
            const container = document.getElementById('applicantsContainer');
            if (!container) return;

            let filtered = filterApplicants(currentTab);
            filtered = sortApplicants(filtered, currentSort);

            if (filtered.length === 0) {
                container.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-icon"><i class="fas fa-users"></i></div>
                        <h4>No applicants found</h4>
                        <p>No applicants match the current filter</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filtered.map(app => `
                <div class="applicant-card fade-in" onclick="window.location.href='applicant-profile.html?id=${app.id}'">
                    <div class="applicant-avatar" style="background: linear-gradient(135deg, ${app.match >= 80 ? '#2a9d8f' : app.match >= 60 ? 'var(--warning-color)' : 'var(--primary-color)'}, ${app.match >= 80 ? '#264653' : app.match >= 60 ? '#e76f51' : 'var(--secondary-color)'});">
                        ${app.avatar}
                    </div>
                    <div class="applicant-info">
                        <h4 class="applicant-name">${app.name}</h4>
                        <p class="applicant-position">${app.position}</p>
                        <p class="applicant-location"><i class="fas fa-map-marker-alt" style="margin-right: 0.25rem;"></i> ${app.location} • ${app.distance}</p>
                        <div class="applicant-skills">
                            ${app.skills.slice(0, 4).map(skill => `<span class="applicant-skill">${skill}</span>`).join('')}
                            ${app.skills.length > 4 ? `<span class="applicant-skill">+${app.skills.length - 4} more</span>` : ''}
                        </div>
                    </div>
                    <div class="applicant-actions">
                        <div class="match-circle ${app.match >= 80 ? 'high' : app.match >= 60 ? 'medium' : 'low'}" style="width: 52px; height: 52px; font-size: 1rem;">${app.match}%</div>
                        <div style="display: flex; flex-direction: column; gap: 0.35rem;">
                            <span class="status-badge ${getStatusClass(app.status)}">${getStatusLabel(app.status)}</span>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function getStatusClass(status) {
            const classes = {
                'applied': 'status-applied',
                'under-review': 'status-under-review',
                'shortlisted': 'status-shortlisted',
                'interview': 'status-interview',
                'accepted': 'status-accepted',
                'rejected': 'status-rejected'
            };
            return classes[status] || 'status-applied';
        }

        function getStatusLabel(status) {
            const labels = {
                'applied': 'Applied',
                'under-review': 'Under Review',
                'shortlisted': 'Shortlisted',
                'interview': 'Interview',
                'accepted': 'Accepted',
                'rejected': 'Rejected'
            };
            return labels[status] || status;
        }

        // Tab switching
        document.addEventListener('DOMContentLoaded', function() {
            const tabs = document.querySelectorAll('.tab-btn');
            tabs.forEach(tab => {
                tab.addEventListener('click', function() {
                    tabs.forEach(t => t.classList.remove('active'));
                    this.classList.add('active');
                    currentTab = this.dataset.tab;
                    renderApplicants();
                });
            });

            // Sort filter
            document.getElementById('sortFilter').addEventListener('change', function() {
                currentSort = this.value;
                renderApplicants();
            });

            // Job filter
            document.getElementById('jobFilter').addEventListener('change', function() {
                // Would filter by jobId in real app
                renderApplicants();
            });

            // Initial render
            renderApplicants();
        });
