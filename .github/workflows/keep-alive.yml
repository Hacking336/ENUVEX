name: Keep the ENUVEX API awake

# The Render free instance sleeps after a few idle minutes; the first request
# then waits through a 30-50 second cold start. A request every 10 minutes keeps
# it warm so the website, and the mobile apps that call the same API, open fast.
#
# GitHub pauses scheduled workflows in repositories with no activity for 60
# days; any commit resumes it. The job can also be started by hand from the
# Actions tab (workflow_dispatch).
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    # A free Render instance that has been asleep can take well over a minute to
    # answer the first request, so the job needs a wider budget than the ping
    # itself: three attempts of up to three minutes each.
    timeout-minutes: 12
    steps:
      - name: Ping the health endpoint
        run: |
          for attempt in 1 2 3; do
            if curl --fail --silent --show-error --max-time 180 https://enuvex.onrender.com/api/health; then
              echo "API is awake."
              exit 0
            fi
            echo "Attempt ${attempt} failed; the instance may still be starting, retrying."
            sleep 20
          done
          echo "The API did not answer." >&2
          exit 1
